<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xếp giường – Khoa Ngoại BV An Bình</title>
<style>
:root{
  --bg:#eef1f5;--card:#fff;--ink:#18212d;--muted:#5d6b7c;--line:#cfd6df;
  --th:#1a56c4;--th-bg:#dbe7ff;
  --nieu:#b25a00;--nieu-bg:#ffe6bf;
  --tk:#6a3cc0;--tk-bg:#e9dfff;
  --ln:#0a7468;--ln-bg:#cdf1ea;
  --m:#1f5f9e;--f:#b8336f;
  --warn:#b42318;--warn-bg:#fde8e6;--ok:#17763a;--accent:#0e6655;--accent-bg:#e6f5f1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.4 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---- thanh trên ---- */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.top h1{font-size:19px}
.top .sub{color:var(--muted);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;align-items:center}
.tools>*{margin:4px 0 4px 8px}
#q{width:230px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#9aa6b5}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.big{padding:9px 18px;font-size:15px}
.btn.danger{color:var(--warn);border-color:#e6b3ae}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

.stats{display:flex;flex-wrap:wrap;align-items:stretch;padding:10px 16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0 8px 8px 0;border-left-width:5px;min-width:120px}
.stat>span:first-child{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:19px}
.stat i{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.stat.z-TH{border-left-color:var(--th)} .stat.z-NIEU{border-left-color:var(--nieu)}
.stat.free{border-left-color:var(--ok)} .stat.bad{border-left-color:var(--warn)} .stat.none{border-left-color:var(--line)}
.stat.now{flex:1;min-width:260px;border-left-color:var(--line)}
.stat.now .chip{margin:4px 4px 0 0;font-size:13px;color:var(--ink)}

main{padding:4px 16px 24px}
.notice{background:#fff8e1;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.notice.err{background:var(--warn-bg);border-color:#e6b3ae}

/* ---- sơ đồ ---- */
.mapwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.mapin{min-width:1140px}
.maprow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.corridor{text-align:center;letter-spacing:.6em;color:#8a96a6;font-size:11px;padding:8px 0;margin:6px 0;background:repeating-linear-gradient(90deg,#f1f3f6 0 14px,#e9ecf1 14px 28px);border-radius:6px}
.cell{border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a96a6;min-height:70px;text-align:center;font-size:12px}
.cell.blank{border:0}
.cell.closed{background:repeating-linear-gradient(45deg,#f4f5f7 0 8px,#eceef2 8px 16px)}
.cell b{font-size:14px}
.room{border:1px solid var(--line);border-top:5px solid var(--line);border-radius:8px;background:#fbfcfd;padding:5px;display:flex;flex-direction:column}
.room.z-TH{border-top-color:var(--th)} .room.z-NIEU{border-top-color:var(--nieu)}
.room.off{opacity:.5}
.rhead .r1{display:flex;align-items:baseline;justify-content:space-between}
.rhead .r1 b{font-size:17px}
.rhead .cnt{font-size:12px;color:var(--muted)}
.rhead .r2{display:flex;flex-wrap:wrap;margin:2px 0 2px}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin:0 3px 2px 0;border:1px solid transparent;white-space:nowrap}
.z-TH .tag.zone{background:var(--th-bg);color:var(--th)} .z-NIEU .tag.zone{background:var(--nieu-bg);color:var(--nieu)}
.tag.g-M{background:var(--m);color:#fff} .tag.g-F{background:var(--f);color:#fff}
.tag.g-M.soft{background:#fff;color:var(--m);border-color:var(--m)} .tag.g-F.soft{background:#fff;color:var(--f);border-color:var(--f)}
.tag.g-any{background:#eef0f3;color:var(--muted)} .tag.g-X{background:var(--warn);color:#fff}
.tag.svc{background:#fff;color:#7a5b00;border-color:#d9b84a;vertical-align:2px}
.bed{display:flex;align-items:center;width:100%;height:29px;border:1px solid var(--line);border-left-width:4px;border-radius:5px;background:#fff;padding:0 4px;margin-top:3px;text-align:left;font-size:12.5px;overflow:hidden}
.bed .bn{width:14px;flex:none;color:var(--muted);font-size:11px}
.bed .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bed .gx{flex:none;font-size:12px;margin-left:2px}
.gx.g-M{color:var(--m)} .gx.g-F{color:var(--f)}
.bed .bd{flex:none;font-size:9.5px;font-weight:700;background:var(--warn);color:#fff;border-radius:3px;padding:0 3px;margin-left:3px}
.bed.free{border-style:dashed;border-left-width:1px;background:#fff}
.bed.free .nm{font-weight:400;color:#a3adba}
.bed.free:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.bed.free:hover:not(:disabled) .nm{color:var(--accent)}
.bed.occ:hover{filter:brightness(.95)}
.s-TH{background:var(--th-bg);border-color:var(--th)} .s-NIEU{background:var(--nieu-bg);border-color:var(--nieu)}
.s-TK{background:var(--tk-bg);border-color:var(--tk)} .s-LNMM{background:var(--ln-bg);border-color:var(--ln)}
.bed.board{box-shadow:0 0 0 2px var(--warn) inset}
.bed.free.held{border-color:#8a96a6;background:#f3f5f8}
.bed.free.held .nm{color:#5d6b7c;font-style:italic;font-weight:600}
.bed .bd.op{background:#5d6b7c}
.bed.dim{opacity:.22} .bed.hit{box-shadow:0 0 0 2px #111 inset}

/* ---- bảng dưới ---- */
.panels{display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{font-size:15px;margin-bottom:8px}
.panel h3 .n{display:inline-block;min-width:22px;text-align:center;background:#e7eaef;border-radius:11px;padding:0 6px;font-size:13px;margin-left:4px}
.panel h3 .n.hot{background:var(--warn);color:#fff}
.hint{color:var(--muted);font-size:13px}
.hint.warn{color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f4;padding:8px 0}
.list li:first-child{border-top:0}
.list .acts{flex:none;margin-left:10px;white-space:nowrap}
.list .acts .btn{margin-left:4px}
.mv{font-size:13px;color:#334}
.chip{display:inline-block;border:1px solid;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.lg{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:13px}
.lg>*{margin:0 6px 4px 0}
.steps{margin:6px 0 0;padding-left:18px;font-size:13px;color:#334}
footer{margin-top:12px;color:var(--muted);font-size:12.5px}

/* ---- hộp thoại ---- */
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(15,23,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1040px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:18px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:0 6px}
.mbody{padding:14px 18px}
.mbody h3{font-size:14.5px;margin:16px 0 6px}
.mbody h3:first-child{margin-top:0}
.mfoot{display:flex;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.mfoot .btn{margin-left:8px}
.mfoot .sp{flex:1}
.fld{margin-bottom:10px}
.fld>label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.fld input[type=text],.fld input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:8px 15px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.sugwrap{background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.sugwrap h3{margin:0 0 8px}
.sug{display:flex;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;background:#fff;padding:7px 10px;margin-bottom:6px}
.sug.t1{border-left-color:#c99a00} .sug.t2,.sug.t3{border-left-color:var(--warn)}
.sug.on{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.sug .sr{width:104px;flex:none;font-size:16px;font-weight:700}
.sug .sd{flex:1;font-size:13px}
.sug .sd small{color:var(--muted)}
.sug .best{flex:none;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:10px;padding:1px 8px}
.other{margin-top:4px;font-size:13px}
.other select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:320px}
.picked{margin-top:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:14px}
.picked .w{color:var(--warn);font-weight:600} .picked .i{color:var(--nieu);font-size:13px}
.err{color:var(--warn);font-weight:600;margin-top:8px;min-height:1em}
.psum{font-size:15px;margin-bottom:10px}
table.info{border-collapse:collapse;width:100%}
table.info th{text-align:left;width:160px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;vertical-align:top}
table.info td{padding:6px 0}
.chk{display:block;margin-top:12px;font-size:13.5px}
table.set{border-collapse:collapse;width:100%;font-size:13.5px}
table.set th,table.set td{border-bottom:1px solid #edf0f4;padding:5px 8px;text-align:left}
table.set th{color:var(--muted);font-size:12.5px}
table.set select,table.set input[type=number]{padding:4px 6px;border:1px solid var(--line);border-radius:6px}
table.set input[type=number]{width:60px}
.mbody textarea,.mbody input.full{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.databtns .btn{margin:0 6px 6px 0}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:260px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px solid #f0f2f5}
.log span{color:var(--muted);margin-right:8px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rbar>span{margin-right:8px;font-weight:600}
.rbar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-weight:600;margin:3px 0}
.reportbox{border:1px solid var(--line);border-radius:8px;padding:14px;max-height:60vh;overflow:auto}

/* ---- danh sách in ---- */
.rp{font-size:13px;color:#000}
.rp-top{display:flex;justify-content:space-between;font-size:12px}
.rp h2{text-align:center;font-size:17px;margin:10px 0 2px}
.rp-sum{text-align:center;margin-bottom:8px}
.rp h3{font-size:14px;margin:12px 0 4px}
.rp h3 span{font-weight:400}
.rp table{border-collapse:collapse;width:100%}
.rp th,.rp td{border:1px solid #555;padding:3px 5px;text-align:left;vertical-align:top}
.rp th{background:#eee;font-size:12px}
.rp td.c,.rp th.c{text-align:center}
.rp tr{page-break-inside:avoid}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18212d;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw}
#printArea{display:none}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 id="wardName">Khoa Ngoại – Bệnh viện An Bình</h1>
    <div class="sub" id="todayLine"></div>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Tìm người bệnh / bác sĩ…" autocomplete="off">
    <button class="btn primary big" data-act="new">+ Nhận bệnh</button>
    <button class="btn" data-act="report">Danh sách ngày</button>
    <button class="btn" data-act="history">Lịch sử</button>
    <button class="btn" data-act="settings">Cài đặt</button>
  </div>
</header>

<noscript><div class="notice err" style="margin:12px 16px 0">
  <b>Trang đang ở chế độ xem trước nên chưa chạy được.</b>
  Trên máy tính: bấm đúp vào file để mở bằng Chrome hoặc Edge.
  Trên iPad/iPhone: ứng dụng Tệp, Zalo, Mail chỉ xem trước chứ không chạy được trang này; cần mở bằng Safari qua một địa chỉ web.
</div></noscript>

<div class="stats" id="stats"></div>

<main>
  <div id="notice"></div>
  <section class="mapwrap"><div id="map"></div></section>
  <section class="panels">
    <div class="panel" id="pnlTransfer"></div>
    <div class="panel" id="pnlWaiting"></div>
    <div class="panel" id="pnlLegend"></div>
  </section>
  <footer id="foot"></footer>
</main>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<div id="printArea"></div>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script>
(function () {
'use strict';

/* ================= CẤU HÌNH CỐ ĐỊNH ================= */
// Số phiên bản: đổi ở đây mỗi lần phát hành và ghi vào LICH-SU-PHIEN-BAN.md
var VERSION = '1.0', VERSION_DATE = '13/10/2026';
var KEY = 'xepgiuong.khoangoai.v1';
// Sơ đồ khoa: hai dãy phòng hai bên hành lang, vẽ từ trái sang phải đúng như thực tế.
var MAP = {
  top: [{blank: 1}, {label: 'Phòng BS'}, '612', '614', '615', '616', '617', '618', '619', '620'],
  bot: ['610', '609', '608', '607', {label: '606', closed: 1}, '605', '604', '603', '602', '601']
};
var ZONES = {TH: 'Tiêu hóa', NIEU: 'Niệu'};
var GENDER = {M: 'Nam', F: 'Nữ'};
var DEFAULT_WARD = 'Khoa Ngoại – Bệnh viện An Bình';

var SNAP_KEY = KEY + '.snap', NO_DOC = '\u0001';
var SAMPLE_DOCTORS = ['Bác sĩ A', 'Bác sĩ B', 'Bác sĩ C', 'Bác sĩ D', 'Bác sĩ E'];
// Nơi nhận bệnh về khoa và hình thức ra khoa. "MO" (đi mổ) không phải ra hẳn: người bệnh tạm vắng, giường được giữ.
var SOURCES = [['CC', 'Cấp cứu'], ['PK', 'Phòng khám'], ['KK', 'Khoa khác / phòng mổ']];
var OUT_TYPES = [['XV', 'Xuất viện'], ['CK', 'Chuyển khoa khác'], ['MO', 'Chuyển đi mổ'], ['XVE', 'Xin về'], ['CV', 'Chuyển viện'], ['TV', 'Tử vong']];

// Mở bằng liên kết có đuôi "#mau" = bản xem thử giao diện: tự nạp dữ liệu mẫu, không tự tải file sao lưu.
var DEMO = location.hash === '#mau';
var outForm = null;
var state, form = null, query = '', reportBy = 'spec', reportDoctor = '', storageOK = true, savedAt = '', toastTimer = null;

/* ================= DỮ LIỆU ================= */
function defaultRooms() {
  // phòng 2–3 giường là phòng dịch vụ: chỉ xếp khi người bệnh yêu cầu
  function R(id, size, zone, gender) { return {id: id, size: size, zone: zone, gender: gender, svc: size <= 3, active: true}; }
  return [
    R('601', 2, 'NIEU', 'auto'), R('602', 2, 'NIEU', 'F'), R('603', 2, 'NIEU', 'M'),
    R('604', 3, 'NIEU', 'F'), R('605', 3, 'NIEU', 'M'),
    R('607', 3, 'TH', 'auto'), R('608', 3, 'TH', 'auto'), R('609', 3, 'TH', 'auto'), R('610', 2, 'TH', 'auto'),
    R('612', 6, 'TH', 'auto'), R('614', 6, 'TH', 'auto'), R('615', 6, 'TH', 'auto'),
    // Niệu luôn cần đủ phòng Nam và phòng Nữ cho từng loại phòng (2, 3, 4, 6 giường)
    R('616', 6, 'NIEU', 'M'), R('617', 6, 'NIEU', 'F'),
    R('618', 4, 'TH', 'auto'),
    R('619', 4, 'NIEU', 'M'), R('620', 4, 'NIEU', 'F')
  ];
}
function defaultState() {
  return {
    version: 2,
    ward: DEFAULT_WARD,
    rooms: defaultRooms(),
    specs: [
      {id: 'TH', name: 'Tiêu hóa', zone: 'TH'},
      {id: 'NIEU', name: 'Niệu', zone: 'NIEU'},
      {id: 'TK', name: 'Thần kinh', zone: 'TH'},
      {id: 'LNMM', name: 'LN-MM', zone: 'TH'}
    ],
    doctors: [],
    patients: [],
    discharged: [],
    log: [],
    seq: 1,
    sample: false,        // đang chứa dữ liệu mẫu
    autoFile: true,       // mỗi ngày tự tải một file sao lưu
    lastFileDay: null,
    lastBackup: null
  };
}
function migrate(s) {
  var d = defaultState(), old = (s.version || 1) < 2;
  Object.keys(d).forEach(function (k) { if (s[k] === undefined || s[k] === null && d[k] !== null) s[k] = d[k]; });
  s.rooms.forEach(function (r) {
    if (r.svc === undefined) r.svc = r.size <= 3;
    // bản 1 để 616, 617 cho Tiêu hóa; Niệu cần cả phòng 6 giường Nam và Nữ
    if (old && r.zone === 'TH' && r.gender === 'auto' && (r.id === '616' || r.id === '617')) { r.zone = 'NIEU'; r.gender = r.id === '616' ? 'M' : 'F'; }
  });
  s.version = 2;
  return s;
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && Array.isArray(s.rooms) && Array.isArray(s.patients)) return migrate(s);
    }
  } catch (e) { storageOK = false; }
  return defaultState();
}
// Không có nút "Lưu": mỗi thao tác đều gọi commit() và được ghi ngay vào trình duyệt.
function save() {
  var json = JSON.stringify(state), d = new Date();
  try { localStorage.setItem(KEY, json); storageOK = true; }
  catch (e) {
    // hết chỗ: bỏ các bản lưu cũ để giữ dữ liệu hiện tại
    try { localStorage.removeItem(SNAP_KEY); localStorage.setItem(KEY, json); storageOK = true; }
    catch (e2) { storageOK = false; }
  }
  if (storageOK) savedAt = pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function commit() { dailySnapshot(); save(); dailyFile(); render(); }

/* ---- bản lưu tự động ---- */
function snapshots() {
  try { var a = JSON.parse(localStorage.getItem(SNAP_KEY)); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function putSnapshot(label, raw, auto) {
  var a = snapshots(), n;
  try { n = JSON.parse(raw).patients.length; } catch (e) { return; }
  if (!n && auto) return;
  a.unshift({t: nowStamp(), day: today(), auto: auto ? 1 : 0, label: label, n: n, data: raw});
  while (a.length > 10) a.pop();

// Mức phù hợp: 0 = đúng khu, đúng loại phòng · 1 = đúng khu, khác loại phòng

    free.forEach(function (b) { var h = held[rm.id + '|' + b]; if (!h) open.push(b); else if (h.id === p.id) own = b; });

function closeModal() { $('overlay').hidden = true; $('modal').innerHTML = ''; form = null; }

function roomSizes() {

}

/* ---- nhận bệnh / sửa / chuyển giường ---- */

function refreshSug() {

  var cur = f.pid ? patientById(f.pid) : null;
  var cands = candidates(p, {excludeRoom: cur && cur.room ? cur.room : null});
  if (!f.manual) f.pick = cands.length ? {room: cands[0].room.id, bed: cands[0].bed} : 'wait';

  if (!cands.length) h += '<p class="hint warn">Không còn giường trống đúng giới ở cả hai khu. Có thể để chờ giường hoặc tự chọn giường bên dưới.</p>';

      (i === 0 ? '<span class="best">Đề xuất</span>' : '') + '</button>';

    if (!rm.active) return;

      var g = rm.gender !== 'auto' ? GENDER[rm.gender] : (gendersOf(occ) ? roomGenderText(rm, occ) : 'linh hoạt');

function pickSummary(p) {

  if (p.want && rm.size !== p.want) w.push('<span class="i">Chưa đúng loại phòng yêu cầu – sẽ được nhắc khi có phòng ' + p.want + ' giường.</span>');

function addDoctor(n) { if (n && state.doctors.indexOf(n) < 0) state.doctors.push(n); }
function saveForm() {
  var f = form, p, msg;
  function fail(m) { $('f_err').textContent = m; return false; }
  if (f.mode !== 'move') {
    f.name = $('f_name').value.replace(/\s+/g, ' ').trim();
    f.yob = $('f_yob').value.trim();
    f.doctor = $('f_doctor').value.replace(/\s+/g, ' ').trim();
    f.dx = $('f_dx').value.trim();
    f.note = $('f_note').value.trim();
    var dt = parseDate($('f_date').value);
    if (!dt) return fail('Ngày vào khoa chưa đúng, hãy ghi theo dạng ngày/tháng/năm, ví dụ ' + fmtDate(today()) + '.');
    f.date = dt;
    if (!f.name) return fail('Chưa nhập họ tên.');
    if (!f.gender) return fail('Chưa chọn giới.');
    if (!f.spec) return fail('Chưa chọn chuyên khoa.');
    if (f.mode === 'new' && !f.src) return fail('Chưa chọn người bệnh được nhận từ đâu.');
    if (f.yob &&!(+f.yob >= 1900 && +f.yob <= new Date().getFullYear())) return fail('Năm sinh chưa hợp lệ.');
  }
  if (f.mode === 'new') {
    p = {id: null, name: f.name, yob: f.yob ? +f.yob : null, gender: f.gender, spec: f.spec, doctor: f.doctor, want: f.want,
      dx: f.dx, note: f.note, admittedAt: f.date, src: f.src, room: null, bed: null, hold: false};
    if (f.pick && f.pick !== 'wait') {
      if (!placeOK(p, f.pick.room, f.pick.bed)) { refreshSug(); return false; }
      p.room = f.pick.room; p.bed = f.pick.bed;
    }
    p.id = state.seq++;
    state.patients.push(p);
    addDoctor(p.doctor);
    addLog('Nhận bệnh từ ' + labelOf(SOURCES, p.src) + ': ' + p.name + ' (' + specName(p.spec) + ', ' + GENDER[p.gender] + ') → ' + (p.room ? bedLabel(p.room, p.bed) : 'chờ giường'));
    msg = 'Đã nhận ' + p.name + (p.room ? ' vào ' + bedLabel(p.room, p.bed) : ' – đang chờ giường');
  } else if (f.mode === 'edit') {
    p = patientById(f.pid);
    p.name = f.name; p.yob = f.yob ? +f.yob : null; p.gender = f.gender; p.spec = f.spec; p.doctor = f.doctor;
    p.want = f.want; p.dx = f.dx; p.note = f.note; p.admittedAt = f.date; p.src = f.src;
    addDoctor(p.doctor);
    addLog('Sửa thông tin: ' + p.name);
    msg = 'Đã lưu thông tin.';
  } else {
    p = patientById(f.pid);
    if (!f.pick || f.pick === 'wait') {
      if (p.room) { addLog('Trả giường: ' + p.name + ' · ' + bedLabel(p.room, p.bed) + ' → chờ giường'); p.room = null; p.bed = null; }
      if (p.away) { endAway(p); addLog('Mổ về: ' + p.name + ' → chờ giường'); }
      msg = p.name + ' đang ở danh sách chờ giường.';
    } else {
      if (!movePatient(p, f.pick.room, f.pick.bed)) { refreshSug(); return false; }
      msg = 'Đã chuyển ' + p.name + ' sang ' + bedLabel(p.room, p.bed);
    }
  }
  closeModal(); commit(); toast(msg);
  return true;
}

// Số vào khoa, ra khoa, đi mổ trong ngày hôm nay (dùng cho giao ban).

  function detail(by, list) {
    var a = list.filter(function (x) { return by[x[0]]; }).map(function (x) { return x[1] + ' ' + by[x[0]]; });
    return a.length ? ' (' + a.join(', ') + ')' : '';
  }
  state.patients.concat(state.discharged).forEach(function (p) {
    if (p.admittedAt === t) { nIn++; inBy[p.src] = (inBy[p.src] || 0) + 1; }
    if (p.opAt === t) nOp++;
  });
  state.discharged.forEach(function (d) {
    if (d.outDay === t) { nOut++; outBy[d.outType] = (outBy[d.outType] || 0) + 1; }
  });
  return 'Trong ngày ' + fmtDate(t) + ': vào khoa ' + nIn + detail(inBy, SOURCES) + ' · ra khoa ' + nOut + detail(outBy, OUT_TYPES) + ' · đi mổ ' + nOp;

// Xuất dạng văn bản ngăn cách bằng tab, mã UTF-16: Excel mở thẳng được, không lỗi dấu tiếng Việt.

    '<h3>5. Lưu và sao lưu</h3>' +
    '<p class="hint">Mọi thao tác được lưu tự động ngay vào trình duyệt của máy này, không cần bấm lưu. Rủi ro còn lại là trình duyệt bị xóa dữ liệu duyệt web hoặc máy hỏng, nên phần mềm tự sao lưu thêm:</p>' +
    '<label class="chk" style="margin:6px 0 10px"><input type="checkbox" data-set="autoFile"' + (state.autoFile === false ? '' : ' checked') + '> ' +
    'Mỗi ngày tự tải một file sao lưu về thư mục Tải xuống (Downloads) của máy, vào lúc có thao tác đầu tiên trong ngày</label>' +
    '<div class="databtns"><button class="btn" data-act="backup">Sao lưu ra file ngay</button><button class="btn" data-act="restore">Khôi phục từ file</button>' +
    '<button class="btn" data-act="sample">Nạp dữ liệu mẫu</button><button class="btn" data-act="resetRooms">Về sơ đồ phân khu mặc định</button>' +
    '<button class="btn danger" data-act="wipe">Xóa toàn bộ người bệnh</button></div>';
  var snaps = snapshots();
  h += '<h3>6. Bản lưu tự động trong máy</h3><p class="hint">Mỗi ngày phần mềm giữ lại một bản đầu ngày, và một bản trước mỗi lần xóa hay khôi phục; tối đa 10 bản. Dùng khi lỡ thao tác nhầm.</p>';
  if (snaps.length) {
    h += '<table class="set"><tr><th>Bản lưu</th><th>Lưu lúc</th><th>Số người bệnh</th><th></th></tr>';
    snaps.forEach(function (s, i) {
      h += '<tr><td>' + esc(s.label) + '</td><td>' + esc(s.t) + '</td><td>' + s.n + '</td><td><button class="btn small" data-act="snap" data-i="' + i + '">Quay về bản này</button></td></tr>';
    });
    h += '</table>';
  } else h += '<p class="hint">Chưa có bản lưu nào.</p>';
  h += '</div><div class="mfoot"><button class="btn primary" data-act="close">Xong</button></div>';
  showModal(h, 'wide');
}
function applySetting(el) {
  var set = el.getAttribute('data-set'), rm = el.dataset.room ? roomById(el.dataset.room) : null;
  if (set === 'zone') rm.zone = el.value;
  else if (set === 'gender') rm.gender = el.value;
  else if (set === 'active') rm.active = el.checked;
  else if (set === 'svc') rm.svc = el.checked;
  else if (set === 'autoFile') state.autoFile = el.checked;
  else if (set === 'size') {
    var n = Math.round(+el.value), maxBed = 0;
    occupantsOf(rm.id).forEach(function (p) { if (p.bed > maxBed) maxBed = p.bed; });
    if (!(n >= 1 && n <= 12) || n < maxBed) {
      alert(n < maxBed ? 'Phòng ' + rm.id + ' đang có người nằm giường số ' + maxBed + ', không giảm xuống ' + n + ' giường được.' : 'Số giường phải từ 1 đến 12.');
      el.value = rm.size; return;
    }
    rm.size = n;
  }
  else if (set === 'specZone') specById(el.dataset.spec).zone = el.value;
  else if (set === 'doctors') {
    var seen = {};
    state.doctors = el.value.split(/\n/).map(function (s) { return s.replace(/\s+/g, ' ').trim(); }).filter(function (s) { if (!s || seen[s]) return false; seen[s] = 1; return true; });
  }
  else if (set === 'ward') state.ward = el.value.trim() || DEFAULT_WARD;
  commit();
  if ($('set_sum')) $('set_sum').innerHTML = nieuCheckText();
}
function backup() { backupFile(); renderFoot(); toast('Đã tải file sao lưu về máy.'); }
function restoreSnapshot(i) {
  var s = snapshots()[i], data;
  if (!s) return;
  try { data = JSON.parse(s.data); } catch (e) { alert('Bản lưu này bị lỗi, không đọc được.'); return; }
  if (!confirm('Đưa dữ liệu về bản lưu "' + s.label + '" (' + s.n + ' người bệnh, lưu lúc ' + s.t + ')?\nDữ liệu hiện tại sẽ được giữ thành một bản lưu để có thể quay lại.')) return;
  keepCopy('Trước khi quay về bản lưu');
  state = migrate(data); closeModal(); commit(); toast('Đã quay về bản lưu: ' + s.label);
}
function restoreFile(file) {
  var r = new FileReader();
  r.onload = function () {
    var s;
    try { s = JSON.parse(r.result); } catch (e) { s = null; }
    if (!s || !Array.isArray(s.rooms) || !Array.isArray(s.patients)) { alert('File sao lưu không hợp lệ.'); return; }
    if (!confirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại bằng dữ liệu trong file (' + s.patients.length + ' người bệnh). Tiếp tục?')) return;
    keepCopy('Trước khi khôi phục từ file');
    state = migrate(s); closeModal(); commit(); toast('Đã khôi phục dữ liệu từ file.');
  };
  r.readAsText(file);
}
function wipe() {
  if (!confirm('XÓA toàn bộ người bệnh, lịch sử và nhật ký? (Phân khu phòng và danh sách bác sĩ được giữ lại)')) return;
  if (!confirm('Chắc chắn xóa? (Vẫn có thể lấy lại trong Cài đặt → Bản lưu tự động trong máy)')) return;
  keepCopy('Trước khi xóa toàn bộ');
  clearPatients();
  closeModal(); commit(); toast('Đã xóa toàn bộ người bệnh.');
}
function clearPatients() {
  state.patients = []; state.discharged = []; state.log = [];
  if (state.sample) state.doctors = state.doctors.filter(function (n) { return SAMPLE_DOCTORS.indexOf(n) < 0; });
  state.sample = false;
}
function wipeSample() {
  if (!confirm('Xóa toàn bộ dữ liệu mẫu trên sơ đồ để bắt đầu dùng thật?')) return;
  clearPatients(); commit(); toast('Đã xóa dữ liệu mẫu. Có thể bắt đầu nhận bệnh.');
}
function resetRooms() {
  var def = defaultRooms(), bad = null;
  state.patients.forEach(function (p) {
    if (!p.room) return;
    var d = def.filter(function (r) { return r.id === p.room; })[0];
    if (!d || p.bed > d.size) bad = p;
  });
  if (bad) { alert('Không đặt lại được vì ' + bad.name + ' đang nằm giường ' + bedLabel(bad.room, bad.bed) + ' không có trong sơ đồ mặc định.'); return; }
  if (!confirm('Đặt lại khu, giới và số giường của tất cả các phòng về mặc định?')) return;
  state.rooms = def; commit(); openSettings();
}
function loadSample() {
  if ((state.patients.length || state.discharged.length) && !confirm('Dữ liệu mẫu sẽ THAY THẾ toàn bộ người bệnh hiện có. Tiếp tục?')) return;
  function ago(n) { var d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }
  keepCopy('Trước khi nạp dữ liệu mẫu');
  state.patients = []; state.discharged = []; state.log = [];
  state.sample = true;
  SAMPLE_DOCTORS.forEach(addDoctor);
  // [họ tên, năm sinh, giới, chuyên khoa, bác sĩ, loại phòng yêu cầu, chẩn đoán, số ngày đã nằm, phòng ép, giường ép]
  var S = [
    ['Lý Văn Tám', 1958, 'M', 'NIEU', 'Bác sĩ D', 0, 'Sỏi niệu quản trái', 1, '618', 1],
    ['Nguyễn Văn An', 1971, 'M', 'TH', 'Bác sĩ A', 0, 'Viêm ruột thừa cấp', 2],
    ['Trần Thị Bích', 1985, 'F', 'TH', 'Bác sĩ A', 0, 'Sỏi túi mật', 1],
    ['Lê Văn Cường', 1960, 'M', 'TH', 'Bác sĩ B', 0, 'Thoát vị bẹn phải', 3],
    ['Phạm Thị Dung', 1949, 'F', 'TH', 'Bác sĩ B', 0, 'Tắc ruột do dính', 4],
    ['Huỳnh Văn Em', 1992, 'M', 'TH', 'Bác sĩ A', 0, 'Viêm ruột thừa cấp', 0],
    ['Võ Thị Phượng', 1978, 'F', 'TH', 'Bác sĩ C', 2, 'U đại tràng sigma', 6],
    ['Đặng Văn Giàu', 1955, 'M', 'TH', 'Bác sĩ C', 0, 'Thủng dạ dày', 5],
    ['Bùi Thị Hoa', 1990, 'F', 'TH', 'Bác sĩ A', 0, 'Viêm túi mật cấp', 1],
    ['Đỗ Văn Hùng', 1983, 'M', 'TH', 'Bác sĩ B', 3, 'Trĩ độ III', 1],
    ['Ngô Thị Kim', 1967, 'F', 'TH', 'Bác sĩ C', 0, 'Sỏi ống mật chủ', 2],
    ['Dương Văn Lâm', 1975, 'M', 'TH', 'Bác sĩ B', 0, 'Áp xe cạnh hậu môn', 0],
    ['Hồ Thị Mai', 1999, 'F', 'TH', 'Bác sĩ A', 0, 'Viêm ruột thừa cấp', 0],
    ['Trương Văn Nam', 1950, 'M', 'NIEU', 'Bác sĩ D', 0, 'Tăng sinh lành tính tuyến tiền liệt', 3],
    ['Phan Thị Oanh', 1982, 'F', 'NIEU', 'Bác sĩ E', 0, 'Sỏi thận phải', 2],
    ['Mai Văn Phúc', 1969, 'M', 'NIEU', 'Bác sĩ E', 3, 'Sỏi bàng quang', 1],
    ['Đinh Thị Quyên', 1974, 'F', 'NIEU', 'Bác sĩ D', 2, 'Sỏi niệu quản phải', 0],
    ['Cao Văn Rạng', 1963, 'M', 'NIEU', 'Bác sĩ E', 0, 'U bàng quang', 4],
    ['Tạ Thị Sương', 1991, 'F', 'NIEU', 'Bác sĩ D', 0, 'Viêm thận bể thận', 1],
    ['Vũ Văn Tài', 1988, 'M', 'TK', 'Bác sĩ B', 0, 'Chấn thương sọ não nhẹ', 1],
    ['Lâm Thị Uyên', 1957, 'F', 'LNMM', 'Bác sĩ C', 0, 'Suy giãn tĩnh mạch chi dưới', 2]
  ];
  S.forEach(function (a, i) {
    var p = {id: state.seq++, name: a[0], yob: a[1], gender: a[2], spec: a[3], doctor: a[4], want: a[5], dx: a[6], note: 'dữ liệu mẫu',
      admittedAt: ago(a[7]), src: /cấp|Thủng|Tắc|Chấn thương|Áp xe/.test(a[6]) ? 'CC' : i % 5 === 0 ? 'KK' : 'PK', room: null, bed: null, hold: false};
    if (a[8]) { p.room = a[8]; p.bed = a[9]; }
    else { var c = candidates(p)[0]; if (c) { p.room = c.room.id; p.bed = c.bed; } }
    state.patients.push(p);
  });
  // một người đang đi mổ để thấy cách giữ giường
  state.patients.forEach(function (p) {
    if (p.name !== 'Lê Văn Cường' || !p.room) return;
    p.away = true; p.opAt = today(); p.keepRoom = p.room; p.keepBed = p.bed; p.room = null; p.bed = null;
  });
  addLog('Nạp dữ liệu mẫu (' + S.length + ' người bệnh)');
  closeModal(); commit(); toast('Đã nạp dữ liệu mẫu để tập thao tác.');
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var d = el.dataset, p;
  switch (d.act) {
    case 'new': openForm('new'); break;
    case 'admit': openForm('new', {room: d.room, bed: +d.bed}); break;
    case 'patient': openPatient(+d.pid); break;
    case 'close': closeModal(); break;
    case 'seg':
      Array.prototype.forEach.call(el.parentNode.children, function (b) { b.classList.remove('on'); });
      el.classList.add('on');
      if (d.field === 'reportBy') { reportBy = d.val; $('reportBox').innerHTML = reportHTML(); }
      else if (d.field === 'outType') { if (outForm) { outForm.type = d.val; $('out_hint').textContent = outHint(patientById(outForm.pid), d.val); } }
      else if (d.field === 'src') { if (form) form.src = d.val; }
      else if (form) { form[d.field] = d.field === 'want' ? +d.val : d.val; if (!form.preset) form.manual = false; refreshSug(); }
      break;
    case 'confirmOut': confirmOut(); break;
    case 'back': backFromSurgery(+d.pid); break;
    case 'pick': if (form) { form.pick = {room: d.room, bed: +d.bed}; form.manual = true; refreshSug(); } break;
    case 'pickWait': if (form) { form.pick = 'wait'; form.manual = true; refreshSug(); } break;
    case 'saveForm': saveForm(); break;
    case 'edit': openForm('edit', {pid: +d.pid}); break;
    case 'move': openForm('move', {pid: +d.pid}); break;
    case 'discharge': openDischarge(+d.pid); break;
    case 'doMove':
      p = patientById(+d.pid);
      if (p && confirm((p.room ? 'Chuyển ' : 'Xếp ') + p.name + (p.room ? ' từ ' + bedLabel(p.room, p.bed) : '') + ' sang ' + bedLabel(d.room, +d.bed) + '?') && movePatient(p, d.room, +d.bed)) {
        commit(); toast('Đã chuyển ' + p.name + ' sang ' + bedLabel(p.room, p.bed));
      }
      break;
    case 'hold': p = patientById(+d.pid); if (p) { p.hold = true; addLog('Giữ nguyên giường: ' + p.name); commit(); } break;
    case 'report': openReport(); break;
    case 'print': printReport(); break;
    case 'csv': exportExcel(); break;
    case 'history': openHistory(); break;
    case 'undo': undoDischarge(+d.pid); break;
    case 'settings': openSettings(); break;
    case 'backup': backup(); break;
    case 'restore': $('fileRestore').value = ''; $('fileRestore').click(); break;
    case 'sample': loadSample(); break;
    case 'wipe': wipe(); break;
    case 'wipeSample': wipeSample(); break;
    case 'snap': restoreSnapshot(+d.i); break;
    case 'resetRooms': resetRooms(); break;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target, v, p;
  if (el.id === 'f_other') {
    if (form && el.value) { v = el.value.split('|'); form.pick = {room: v[0], bed: +v[1]}; form.manual = true; refreshSug(); }
  } else if (el.id === 'p_hold') {
    p = patientById(+el.dataset.pid);
    if (p) { p.hold = el.checked; commit(); }
  } else if (el.id === 'r_doctor') {
    reportDoctor = el.value; $('reportBox').innerHTML = reportHTML();
  } else if (el.id === 'fileRestore') {
    if (el.files && el.files[0]) restoreFile(el.files[0]);
  } else if (el.getAttribute && el.getAttribute('data-set')) applySetting(el);
});
$('q').addEventListener('input', function () { query = fold(this.value.trim()); renderMap(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeModal(); });
window.addEventListener('storage', function (e) {
  if (e.key !== KEY || !e.newValue || form) return;
  try { state = migrate(JSON.parse(e.newValue)); render(); } catch (x) {}
});

state = load();
if (DEMO && !state.patients.length && !state.discharged.length) loadSample();
else render();
})();
</script>
