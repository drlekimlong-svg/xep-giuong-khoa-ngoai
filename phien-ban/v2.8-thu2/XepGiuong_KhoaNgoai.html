<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- iPad / iPhone: "Thêm vào Màn hình chính" trong Safari sẽ mở toàn màn hình như một ứng dụng -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xếp giường">
<meta name="theme-color" content="#0e6655">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Xếp giường – Khoa Ngoại BV An Bình</title>
<style>
:root{
  --bg:#eef1f5;--card:#fff;--ink:#18212d;--muted:#5d6b7c;--line:#cfd6df;
  --th:#1a56c4;--th-bg:#dbe7ff;
  --nieu:#b25a00;--nieu-bg:#ffe6bf;
  --tk:#6a3cc0;--tk-bg:#e9dfff;
  --ln:#0a7468;--ln-bg:#cdf1ea;
  --m:#1f5f9e;--f:#b8336f;
  --warn:#b42318;--warn-bg:#fde8e6;--ok:#17763a;--accent:#0e6655;--accent-bg:#e6f5f1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.4 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---- thanh trên ---- */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.top h1{font-size:19px}
.top .sub{color:var(--muted);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;align-items:center}
.tools>*{margin:4px 0 4px 8px}
#q{width:230px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#9aa6b5}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.big{padding:9px 18px;font-size:15px}
.btn.danger{color:var(--warn);border-color:#e6b3ae}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

.stats{display:flex;flex-wrap:wrap;align-items:stretch;padding:10px 16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0 8px 8px 0;border-left-width:5px;min-width:120px}
.stat>span:first-child{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:19px}
.stat i{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.stat.z-TH{border-left-color:var(--th)} .stat.z-NIEU{border-left-color:var(--nieu)}
.stat.free{border-left-color:var(--ok)} .stat.bad{border-left-color:var(--warn)} .stat.none{border-left-color:var(--line)}
.stat.now{flex:1;min-width:260px;border-left-color:var(--line)}
.stat.now .chip{margin:4px 4px 0 0;font-size:13px;color:var(--ink)}

main{padding:4px 16px 24px}
.notice{background:#fff8e1;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.notice.err{background:var(--warn-bg);border-color:#e6b3ae}

/* ---- sơ đồ ---- */
.mapwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.mapin{min-width:1100px}
.maprow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.corridor{text-align:center;letter-spacing:.6em;color:#8a96a6;font-size:11px;padding:8px 0;margin:6px 0;background:repeating-linear-gradient(90deg,#f1f3f6 0 14px,#e9ecf1 14px 28px);border-radius:6px}
.cell{border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a96a6;min-height:70px;text-align:center;font-size:12px}
.cell.blank{border:0}
.cell.closed{background:repeating-linear-gradient(45deg,#f4f5f7 0 8px,#eceef2 8px 16px)}
.cell b{font-size:14px}
.room{border:1px solid var(--line);border-top:5px solid var(--line);border-radius:8px;background:#fbfcfd;padding:5px;display:flex;flex-direction:column}
.room.z-TH{border-top-color:var(--th)} .room.z-NIEU{border-top-color:var(--nieu)}
.room.off{opacity:.5}
.rhead .r1{display:flex;align-items:baseline;justify-content:space-between}
.rhead .r1 b{font-size:17px}
.rhead .cnt{font-size:12px;color:var(--muted)}
.rhead .r2{display:flex;flex-wrap:wrap;margin:2px 0 2px}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin:0 3px 2px 0;border:1px solid transparent;white-space:nowrap}
.z-TH .tag.zone{background:var(--th-bg);color:var(--th)} .z-NIEU .tag.zone{background:var(--nieu-bg);color:var(--nieu)}
.tag.g-M{background:var(--m);color:#fff} .tag.g-F{background:var(--f);color:#fff}
.tag.g-M.soft{background:#fff;color:var(--m);border-color:var(--m)} .tag.g-F.soft{background:#fff;color:var(--f);border-color:var(--f)}
.tag.g-any{background:#eef0f3;color:var(--muted)} .tag.g-X{background:var(--warn);color:#fff}
.tag.svc{background:#fff;color:#7a5b00;border-color:#d9b84a;vertical-align:2px}
.tag.rsv{background:#eef0f3;color:#475467;border-color:#98a2b3;vertical-align:2px}
.room.rsv{background:repeating-linear-gradient(135deg,#f6f7f9 0 10px,#eef0f3 10px 20px)}
.bed{display:flex;align-items:center;width:100%;height:29px;border:1px solid var(--line);border-left-width:4px;border-radius:5px;background:#fff;padding:0 4px;margin-top:3px;text-align:left;font-size:12.5px;overflow:hidden}
.bed .bn{width:14px;flex:none;color:var(--muted);font-size:11px}
.bed .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bed .gx{flex:none;font-size:12px;margin-left:2px}
.gx.g-M{color:var(--m)} .gx.g-F{color:var(--f)}
.bed .bd{flex:none;font-size:9.5px;font-weight:700;background:var(--warn);color:#fff;border-radius:3px;padding:0 3px;margin-left:3px}
.bed.free{border-style:dashed;border-left-width:1px;background:#fff}
.bed.free .nm{font-weight:400;color:#a3adba}
.bed.free:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.bed.free:hover:not(:disabled) .nm{color:var(--accent)}
.bed.occ:hover{filter:brightness(.95)}
.s-TH{background:var(--th-bg);border-color:var(--th)} .s-NIEU{background:var(--nieu-bg);border-color:var(--nieu)}
.s-TK{background:var(--tk-bg);border-color:var(--tk)} .s-LNMM{background:var(--ln-bg);border-color:var(--ln)}
.bed.board{box-shadow:0 0 0 2px var(--warn) inset}
.bed.free.held{border-color:#8a96a6;background:#f3f5f8}
.bed.free.held .nm{color:#5d6b7c;font-style:italic;font-weight:600}
.bed .bd.op{background:#5d6b7c}
.bed.dim{opacity:.22} .bed.hit{box-shadow:0 0 0 2px #111 inset}

/* ---- bảng dưới ---- */
.panels{display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{font-size:15px;margin-bottom:8px}
.panel h3 .n{display:inline-block;min-width:22px;text-align:center;background:#e7eaef;border-radius:11px;padding:0 6px;font-size:13px;margin-left:4px}
.panel h3 .n.hot{background:var(--warn);color:#fff}
.hint{color:var(--muted);font-size:13px}
.hint.warn{color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f4;padding:8px 0}
.list li:first-child{border-top:0}
.list .acts{flex:none;margin-left:10px;white-space:nowrap}
.list .acts .btn{margin-left:4px}
.mv{font-size:13px;color:#334}
.chip{display:inline-block;border:1px solid;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.lg{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:13px}
.lg>*{margin:0 6px 4px 0}
.steps{margin:6px 0 0;padding-left:18px;font-size:13px;color:#334}
footer{margin-top:12px;color:var(--muted);font-size:12.5px}

/* ---- hộp thoại ---- */
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(15,23,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1040px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:18px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:0 6px}
.mbody{padding:14px 18px}
.mbody h3{font-size:14.5px;margin:16px 0 6px}
.mbody h3:first-child{margin-top:0}
.mfoot{display:flex;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.mfoot .btn{margin-left:8px}
.mfoot .sp{flex:1}
.fld{margin-bottom:10px}
.fld>label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.fld input[type=text],.fld input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:8px 15px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.sugwrap{background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.sugwrap h3{margin:0 0 8px}
.sug{display:flex;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;background:#fff;padding:7px 10px;margin-bottom:6px}
.sug.t1{border-left-color:#c99a00} .sug.t2,.sug.t3{border-left-color:var(--warn)}
.sug.on{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.sug .sr{width:104px;flex:none;font-size:16px;font-weight:700}
.sug .sd{flex:1;font-size:13px}
.sug .sd small{color:var(--muted)}
.sug .best{flex:none;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:10px;padding:1px 8px}
.other{margin-top:4px;font-size:13px}
.other select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:320px}
.picked{margin-top:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:14px}
.picked .w{color:var(--warn);font-weight:600} .picked .i{color:var(--nieu);font-size:13px}
.err{color:var(--warn);font-weight:600;margin-top:8px;min-height:1em}
.psum{font-size:15px;margin-bottom:10px}
table.info{border-collapse:collapse;width:100%}
table.info th{text-align:left;width:160px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;vertical-align:top}
table.info td{padding:6px 0}
.chk{display:block;margin-top:12px;font-size:13.5px}
table.set{border-collapse:collapse;width:100%;font-size:13.5px}
table.set th,table.set td{border-bottom:1px solid #edf0f4;padding:5px 8px;text-align:left}
table.set th{color:var(--muted);font-size:12.5px}
table.set select,table.set input[type=number]{padding:4px 6px;border:1px solid var(--line);border-radius:6px}
table.set input[type=number]{width:60px}
.mbody textarea,.mbody input.full{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.databtns .btn{margin:0 6px 6px 0}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:260px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px solid #f0f2f5}
.log span{color:var(--muted);margin-right:8px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rbar>span{margin-right:8px;font-weight:600}
.rbar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-weight:600;margin:3px 0}
.reportbox{border:1px solid var(--line);border-radius:8px;padding:14px;max-height:60vh;overflow:auto}

/* ---- danh sách in ---- */
.rp{font-size:13px;color:#000}
.rp-top{display:flex;justify-content:space-between;font-size:12px}
.rp h2{text-align:center;font-size:17px;margin:10px 0 2px}
.rp-sum{text-align:center;margin-bottom:8px}
.rp h3{font-size:14px;margin:12px 0 4px}
.rp h3 span{font-weight:400}
.rp table{border-collapse:collapse;width:100%}
.rp th,.rp td{border:1px solid #555;padding:3px 5px;text-align:left;vertical-align:top}
.rp th{background:#eee;font-size:12px}
.rp td.c,.rp th.c{text-align:center}
.rp tr{page-break-inside:avoid}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18212d;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw}
/* ---- bản dùng chung: đăng nhập, người dùng, chỉ xem ---- */
.login{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80;overflow:auto}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 26px 20px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.logincard h2{font-size:22px;margin-bottom:4px}
.logincard .fld input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.userbox{display:inline-flex;flex-wrap:wrap;align-items:center}
.userbox>*{margin:2px 0 2px 6px}
.userbox .who{font-weight:600;white-space:nowrap}
.userbox .who small{font-weight:400;color:var(--muted)}
.sub.bad{color:var(--warn);font-weight:700}
.bed.free:disabled{cursor:default}
table.set input[type=text]{padding:4px 6px;border:1px solid var(--line);border-radius:6px;width:100%;min-width:90px}
.res-ok{color:var(--ok);font-weight:600} .res-bad{color:var(--warn);font-weight:600}
.slip{border:1px dashed #777;padding:10px 12px;margin:0 0 8px;page-break-inside:avoid;font-size:13px}
.slip b{font-size:15px}

/* ---- iPad, iPhone và màn hình hẹp ---- */
@media (max-width:900px){
  .top{padding:8px 12px}
  .top h1{font-size:17px}
  .tools{width:100%;justify-content:flex-start}
  .tools>*{margin:4px 6px 4px 0}
  .qwrap{flex:1 1 100%}
  #q{width:100%}
  #qres{min-width:0;width:100%}
  .stats{padding:8px 12px 0}
  .stat{flex:1 1 28%;min-width:0;margin:0 6px 6px 0;padding:5px 8px}
  .stat b{font-size:17px}
  .stat.now{flex-basis:100%}
  main{padding:4px 12px 20px}
  .mapwrap{padding:8px}
  .mapin{min-width:0}
  /* bỏ hành lang, xếp các phòng thành lưới thẻ để không phải kéo ngang */
  .maprow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .maprow .cell,.corridor{display:none}
  .desk-only{display:none!important}   /* điện thoại, iPad dọc: nhập tay */
  .maprow+.corridor+.maprow{margin-top:6px}
  .overlay{padding:8px 4px}
  .mhead,.mbody,.mfoot{padding-left:12px;padding-right:12px}
  .mfoot{flex-wrap:wrap}
  .mfoot .btn{margin:4px 0 4px 8px}
  .grid2{grid-template-columns:1fr}
  .mbody{overflow-x:auto}
  .sug .sr{width:86px;font-size:15px}
}
/* màn hình cảm ứng: nút và ô giường to hơn, chữ trong ô nhập 16px để iPhone không tự phóng to */
@media (pointer:coarse){
  .bed{height:36px;font-size:14px}
  .btn{padding:10px 14px}
  .btn.small{padding:7px 11px}
  .seg button{padding:10px 14px}
  input,select,textarea{font-size:16px}
}
/* ---- báo cáo bệnh trong ngày (giao ca) ---- */
.btn.menu{display:block;width:100%;text-align:left;white-space:normal;padding:12px 14px;margin-bottom:10px;font-weight:400}
.btn.menu b{font-size:15.5px} .btn.menu small{color:var(--muted);font-size:13px}
.rp h4{font-size:13.5px;margin:10px 0 4px}
.rp-note{font-size:12px;margin:4px 0 2px}
.rp p.none{margin:6px 0}
.rp tr.grp td{background:#f1f3f5;font-weight:700}
.rp table.sum th{text-align:center;font-size:11.5px}
.who2{display:flex;flex-wrap:wrap;justify-content:space-between;margin:6px 0 4px}
.who2>div{flex:1 1 45%;margin:2px 8px 2px 0}
.shf .dots{color:#777}
.sig{display:flex;justify-content:space-around;text-align:center;margin-top:18px;page-break-inside:avoid}
.sig>div{width:40%} .sig .sgap{height:64px}
.shf.edit table{min-width:860px}
.shf.edit .rpf{width:100%;border:1px solid #d9c56b;border-radius:5px;padding:4px 6px;background:#fffbe6;font:inherit;font-size:13px;min-width:90px}
.shf.edit textarea.rpf{resize:vertical;min-width:130px}
.shf.edit td.tm .rpf{width:64px;min-width:0}
.shf.edit .who2 .rpf{width:auto;min-width:220px;max-width:100%}
@media (pointer:coarse){.shf.edit .rpf{font-size:16px}}
.fld select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld .dt{display:flex}
.fld .dt input[type=text]{flex:1;width:auto;min-width:0}
.fld .dt input[type=text]+input[type=text]{flex:none;width:96px;margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
/* ---- ô mật khẩu có nút hiện/ẩn ---- */
.pwf{position:relative}
.pwf input{padding-right:46px!important}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;color:var(--muted);line-height:0}
.eye:hover,.eye.on{color:var(--accent)}
.eye svg{width:22px;height:22px}
/* ---- tìm kiếm: danh sách kết quả ---- */
.qwrap{position:relative;display:inline-block}
#qres{position:absolute;left:0;top:100%;margin-top:4px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:330px;max-width:92vw;max-height:60vh;overflow:auto}
#qres button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f4;background:#fff;padding:8px 12px;font-size:13.5px}
#qres button:hover{background:var(--accent-bg)}
#qres small{color:var(--muted)}
#qres .none{padding:8px 12px;color:var(--muted);font-size:13px}
/* ---- gợi ý mã ICD-10 ở ô Chẩn đoán ---- */
.icdbox{border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:320px;overflow:auto;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.icdbox .icdi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f4;background:#fff;padding:7px 10px;font-size:13.5px;line-height:1.35}
.icdbox .icdi b{display:inline-block;min-width:54px;color:var(--accent)}
.icdbox .icdi:hover,.icdbox .icdi.on{background:var(--accent-bg)}
.icdbox .icdn{padding:6px 10px;color:var(--muted);font-size:12.5px}
#icdNote:empty{display:none}
.tag.g-mix{background:#eef0f3;color:#475467;border-color:#98a2b3}
.bed .bd.same{background:#7a5b00}
/* ---- báo phiên bản mới ---- */
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:90;background:#0e6655;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;align-items:center;flex-wrap:wrap;max-width:94vw;font-size:14px}
.upd .btn{margin-left:10px;color:var(--accent);background:#fff;border-color:#fff}
.upd .btn.later{color:#fff;background:transparent;border-color:rgba(255,255,255,.75)}
/* ---- người bệnh nằm lâu ---- */
.bed .bd.lng{background:#fff;color:#8a5a00;border:1px solid #d4a72c;padding:0 2px}
.bed .bd.sk{background:var(--warn)}
.bed .bd.skok{background:#e3e8ec;color:#3d4a57}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.stat:hover{border-color:var(--accent)}
.stat.warn{border-left-color:#d4a72c}
.lgs table{min-width:760px}
.lgs tr.pend td{background:#fdecea;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lgs small{color:#555}
.skc{display:inline-flex;align-items:center;white-space:nowrap;cursor:pointer}
.skc input{width:18px;height:18px;margin:0 6px 0 0}
.skw{display:block;font-size:11px;color:#555}
/* ---- lưu lượng người bệnh ---- */
.flw table.fl{min-width:1080px}
.flw table.fl th{text-align:center;font-size:11.5px}
.flw th span{font-weight:400}
.flw td small{display:block;color:#555;font-size:10.5px;font-weight:400;white-space:nowrap}
.flw td.warn{background:#fff1bf;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.flw td.bad{background:#fbd5d2;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.flw table.sum{min-width:700px}
.flw table.sum td:first-child{white-space:nowrap}
#flowNav .nav,#mbNav .nav{margin-left:auto;display:inline-flex;flex-wrap:wrap}
#flowNav .nav .btn,#mbNav .nav .btn{margin:3px 0 3px 6px}
/* ---- mặt bệnh ---- */
.mbr table.mbt{min-width:860px}
.mbr table.mbc{min-width:0}
.mbr table.mbt th{text-align:center;font-size:12px}
.mbr td small{color:#555}
.mbr h3 span{font-weight:400}
/* ---- chúc mừng 20/10 ---- */
.hoa{position:fixed;left:0;top:0;right:0;bottom:0;z-index:96;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:16px}
.hoa canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.hoa-card{position:relative;pointer-events:auto;cursor:pointer;background:linear-gradient(180deg,#fff 0%,#fff0f6 100%);border:2px solid #f8bbd0;border-radius:20px;
  box-shadow:0 18px 50px rgba(173,20,87,.25);padding:12px 22px 16px;max-width:360px;width:100%;text-align:center;animation:hoaIn .7s cubic-bezier(.2,1.4,.4,1) both}
.hoa.off .hoa-card{animation:hoaOut .5s ease forwards}
.hoa svg{width:230px;max-width:66vw;height:auto;display:block;margin:0 auto}
.hoa .flin{transform-box:fill-box;transform-origin:center;animation:hoaBloom .6s cubic-bezier(.3,1.6,.5,1) both}
.hoa-t{font-size:17px;font-weight:700;color:#ad1457;margin-top:2px}
.hoa-d{font-size:30px;font-weight:800;color:#d81b60;letter-spacing:4px;line-height:1.15}
.hoa-m{font-size:15px;color:#4a2337;margin:8px 0 6px;line-height:1.45}
.hoa-s{font-size:12.5px;color:#8e5a73;font-style:italic}
.hoa-btn{background:#fff0f6;border-color:#f48fb1;color:#ad1457;font-weight:600}
@keyframes hoaIn{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes hoaOut{to{opacity:0;transform:scale(.9) translateY(20px)}}
@keyframes hoaBloom{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hoa-card,.hoa .flin{animation:none}}
#printArea{display:none}
@page{size:A4;margin:12mm}
@page ngang{size:A4 landscape;margin:10mm}   /* báo cáo lưu lượng: bảng nhiều cột, in khổ ngang */
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #printArea{display:block!important}
  .flw,.mbr{page:ngang}
  .mbr table.mbt{min-width:0}
  .mbr table.mbt th,.mbr table.mbt td{padding:2px 4px;font-size:11.5px}
  .flw table.fl,.flw table.sum{min-width:0}
  .flw table.fl th,.flw table.fl td{padding:2px 3px;font-size:11px}
}
</style>
</head>

// 15 ngày điều trị" để bác sĩ phụ trách và bác sĩ quản lý khoa nắm. Ngày nằm = ngày thứ N kể từ ngày vào khoa (ngày vào là

/* ---- lưu lượng người bệnh theo chuyên khoa (bản 2.5) ---- */

// (Thần kinh tách riêng từ 04/11/2026; vẫn nằm chung phòng khu Tiêu hóa nên giường so ở dòng "Khu Tiêu hóa").

function applySetting(el) {
  var set = el.getAttribute('data-set'), rm = el.dataset.room ? roomById(el.dataset.room) : null;
  if (set === 'zone') rm.zone = el.value;
  else if (set === 'gender') rm.gender = el.value;
  else if (set === 'active') rm.active = el.checked;
  else if (set === 'svc') rm.svc = el.checked;
  else if (set === 'autoFile') state.autoFile = el.checked;
  else if (set === 'size') {
    var n = Math.round(+el.value), maxBed = 0;
    occupantsOf(rm.id).forEach(function (p) { if (p.bed > maxBed) maxBed = p.bed; });
    if (!(n >= 1 && n <= 12) || n < maxBed) {
      alert(n < maxBed ? 'Phòng ' + rm.id + ' đang có người nằm giường số ' + maxBed + ', không giảm xuống ' + n + ' giường được.' : 'Số giường phải từ 1 đến 12.');
      el.value = rm.size; return;
    }
    rm.size = n;
  }
  else if (set === 'specZone') specById(el.dataset.spec).zone = el.value;
  else if (set === 'specOn') specById(el.dataset.spec).hidden = !el.checked;
  else if (set === 'reserve') rm.reserve = el.checked;
  else if (set === 'doctors' || set === 'depts' || set === 'nurses') {
    var seen = {};
    state[set] = el.value.split(/\n/).map(function (s) { return s.replace(/\s+/g, ' ').trim(); }).filter(function (s) { if (!s || seen[s]) return false; seen[s] = 1; return true; });
  }
  else if (set === 'ward') state.ward = el.value.trim() || DEFAULT_WARD;
  commit();
  if ($('set_sum')) $('set_sum').innerHTML = nieuCheckText();
}

function restoreFile(file) {
  var r = new FileReader();
  r.onload = function () {
    var s;
    try { s = JSON.parse(r.result); } catch (e) { s = null; }
    if (!s || !Array.isArray(s.rooms) || !Array.isArray(s.patients)) { alert('File sao lưu không hợp lệ.'); return; }
    if (!confirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại bằng dữ liệu trong file (' + s.patients.length + ' người bệnh). Tiếp tục?')) return;
    keepCopy('Trước khi khôi phục từ file');
    state = migrate(s); closeModal(); commit(); toast('Đã khôi phục dữ liệu từ file.');
  };
  r.readAsText(file);

  for (i = 0; i < 70; i++) P.push({x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 2});   // rơi từ trên xuống
  P.forEach(function (p, k) { p.w = 6 + Math.random() * 6; p.h = 8 + Math.random() * 8; p.r = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 0.3; p.c = cols[k % cols.length]; p.ph = Math.random() * 6.28; });
  var t0 = Date.now();
  function step() {
    var t = Date.now() - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = t > 3600 ? Math.max(0, 1 - (t - 3600) / 600) : 1;
    P.forEach(function (p) {
      p.vy = (p.vy + 0.18) * 0.97; p.vx *= 0.97; p.x += p.vx + Math.sin(p.ph + t / 280) * 0.7; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20) return;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.ph + t / 150));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (t < 4200) hoaRaf = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  }
  hoaRaf = requestAnimationFrame(step);
}
function hoaShow() {
  hoaHide(true);
  hoaLast = Date.now();
  var el = document.createElement('div'), quiet = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.id = 'hoa'; el.className = 'hoa';
  el.innerHTML = '<canvas></canvas><div class="hoa-card" title="Bấm để đóng">' + hoaSVG() + '<div class="hoa-t">Chúc mừng ngày Phụ nữ Việt Nam</div>' +
    '<div class="hoa-d">20 · 10</div><p class="hoa-m">' + esc(HOA_WISHES[Math.floor(Math.random() * HOA_WISHES.length)]) + '</p>' +
    '<div class="hoa-s">' + esc(state && state.ward || DEFAULT_WARD) + '</div></div>';
  document.body.appendChild(el);
  el.querySelector('.hoa-card').addEventListener('click', function () { hoaHide(); });
  if (!quiet) hoaConfetti(el.querySelector('canvas'));
  hoaTimer = setTimeout(hoaHide, 6000);
}
function hoaHide(now) {
  var el = $('hoa');
  clearTimeout(hoaTimer); if (window.cancelAnimationFrame) cancelAnimationFrame(hoaRaf);
  if (!el) return;
  if (now === true) { el.parentNode.removeChild(el); return; }
  el.classList.add('off');
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
}
// bấm nút trong ngày 20/10: thỉnh thoảng hiện lời chúc (sau khi thao tác vừa bấm đã hiện ra)
function hoaMaybe(act) {
  if (!hoaDay() || act === 'hoa' || act === 'close' || $('hoa')) return;
  if (Date.now() - hoaLast < HOA_GAP || Math.random() >= HOA_CHANCE) return;
  hoaLast = Date.now();
  setTimeout(hoaShow, 400);
}
// lần đầu mở app trong ngày (trên mỗi máy) thì hiện ngay
function hoaStart() {
  if (!hoaDay()) return;
  $('hoaBtn').hidden = false;
  var k = KEY + '.hoa', seen = '';
  try { seen = localStorage.getItem(k) || ''; localStorage.setItem(k, today()); } catch (e) {}
  if (seen !== today() || /[?&]hoa\b/.test(location.search)) setTimeout(hoaShow, 1200);
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click', function (e) {
  var eye = e.target.closest ? e.target.closest('[data-eye]') : null;
  if (eye) { togglePw(eye); return; }
  if (qOpen && !(e.target.closest && e.target.closest('.qwrap'))) { qOpen = false; renderSearch(); }
  if (!(e.target.closest && e.target.closest('.icdwrap'))) icdHide();
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var d = el.dataset, p;
  if (GUARDED.indexOf(d.act) >= 0 && !can(d.act)) { toast('Tài khoản ' + (ROLE_NAMES[myRole()] || '') + ' không được làm việc này.'); return; }
  hoaMaybe(d.act);
  switch (d.act) {
    case 'hoa': hoaShow(); break;
    case 'logout': if (confirm('Đăng xuất khỏi máy này?')) signOut(); break;
    case 'pwChange': showPwChange(false); break;
    case 'pwCancel': $('pwbox').hidden = true; break;
    case 'accounts': openAccounts(); break;
    case 'importHis': importHis(false); break;
    case 'impReread': importHis(false); break;
    case 'impRepick': importHis(true); break;
    case 'impStart': if (imp && imp.res) { imp.queue = imp.res.news.slice(); imp.total = imp.queue.length; importNext(); } break;
    case 'impOne': if (imp && imp.res && imp.res.news[+d.i]) { imp.queue = [imp.res.news[+d.i]]; imp.total = 1; importNext(); } break;
    case 'impSkip': importNext(); break;
    case 'impStop': if (imp) { imp.queue = []; closeModal(); openImport(); } else closeModal(); break;
    case 'impWait': importAllWaiting(); break;
    case 'impLink': importApply('links', +d.i, true); break;
    case 'impFix': importApply('diffs', +d.i, false); break;
    case 'impMaybe':
      if (imp && imp.res && imp.res.maybe[+d.i]) {
        var mx = imp.res.maybe[+d.i];
        if (confirm('Xác nhận người nhập tay “' + mx.p.name + '” chính là ' + mx.h.name + (mx.h.yob ? ' (' + mx.h.yob + ')' : '') + ', mã ' + mx.h.code + '?\n' +
          'Họ tên, năm sinh, giới sẽ được sửa theo danh sách bệnh viện; giường giữ nguyên.')) importApply('maybe', +d.i, true);
      }
      break;
    case 'impNot':
      if (imp && imp.res && imp.res.maybe[+d.i]) { var nx = imp.res.maybe[+d.i]; imp.rejects = imp.rejects || {}; imp.rejects[nx.p.id + '|' + nx.h.code] = 1; openImport(); }
      break;
    case 'accPreview': accPreview(); break;
    case 'accCreate': accCreate(); break;
    case 'accPrint': accPrint(); break;
    case 'accReset': accReset(d.uid); break;
    case 'accLock': if (confirm(d.on === '1' ? 'Mở khóa tài khoản này?' : 'Khóa tài khoản này? Người đó sẽ không vào được app nữa.')) accSet(d.uid, {active: d.on === '1'}, d.on === '1' ? 'Đã mở khóa.' : 'Đã khóa tài khoản.'); break;
    case 'cloudOn': cloudOn(); break;
    case 'cloudOff': cloudOff(); break;
    case 'new': openForm('new'); break;
    case 'admit': openForm('new', {room: d.room, bed: +d.bed}); break;
    case 'patient': qOpen = false; renderSearch(); openPatient(+d.pid); break;
    case 'delRec': openDelete(+d.pid); break;
    case 'delConfirm': confirmDelete(); break;
    case 'restoreDel': restoreDeleted(+d.i); break;
    case 'dupView': openDups(); break;
    case 'dupOk':
      var dids = String(d.ids || '').split(',').map(Number).filter(Boolean);
      if (dids.length > 1 && confirm('Xác nhận đây là ' + dids.length + ' người bệnh KHÁC NHAU, chỉ cùng họ tên?\nNên đối chiếu mã bệnh nhân trên phần mềm bệnh viện trước.')) {
        markDupOk(dids); addLog('Xác nhận khác người, cùng họ tên: ' + ((patientById(dids[0]) || {}).name || '')); commit(); openDups();
      }
      break;
    case 'updReload': location.reload(); break;
    case 'updLater': $('updBar').hidden = true; setTimeout(function () { updShown = ''; }, 30 * 60000); break;
    case 'close': closeModal(); break;
    case 'seg':
      Array.prototype.forEach.call(el.parentNode.children, function (b) { b.classList.remove('on'); });
      el.classList.add('on');
      if (d.field === 'reportBy') { reportBy = d.val; $('reportBox').innerHTML = reportHTML(); }
      else if (d.field === 'outType') {
        if (outForm) { outForm.type = d.val; $('out_hint').textContent = outHint(patientById(outForm.pid), d.val); $('out_deptBox').hidden = d.val !== 'CK'; }
      }
      else if (d.field === 'delKind') { if (delForm) delForm.kind = d.val; }
      else if (d.field === 'flowBy') { flow.by = d.val; flow.off = 0; renderFlow(); }
      else if (d.field === 'mbBy') { mb.by = d.val; mb.off = 0; renderMb(); }
      else if (d.field === 'mbBasis') { mb.basis = d.val; renderMb(); }
      else if (d.field === 'src') { if (form) form.src = d.val; }
      else if (form) { form[d.field] = d.field === 'want' ? +d.val : d.val; if (!form.preset) form.manual = false; refreshSug(); }
      break;
    case 'confirmOut': confirmOut(); break;
    case 'back': backFromSurgery(+d.pid); break;
    case 'opCancel': opCancel(+d.pid); break;
    case 'opDel': opDel(+d.pid, +d.i); break;
    case 'pick': if (form) { form.pick = {room: d.room, bed: +d.bed}; form.manual = true; refreshSug(); } break;
    case 'pickWait': if (form) { form.pick = 'wait'; form.manual = true; refreshSug(); } break;
    case 'icdPick': icdPick(+d.i); break;
    case 'saveForm': saveForm(); break;
    case 'edit': openForm('edit', {pid: +d.pid}); break;
    case 'move': openForm('move', {pid: +d.pid}); break;
    case 'discharge': openDischarge(+d.pid); break;
    case 'doMove':
      p = patientById(+d.pid);
      if (p && confirm((p.room ? 'Chuyển ' : 'Xếp ') + p.name + (p.room ? ' từ ' + bedLabel(p.room, p.bed) : '') + ' sang ' + bedLabel(d.room, +d.bed) + '?') && movePatient(p, d.room, +d.bed)) {
        commit(); toast('Đã chuyển ' + p.name + ' sang ' + bedLabel(p.room, p.bed));
      }
      break;
    case 'hold': p = patientById(+d.pid); if (p) { p.hold = true; addLog('Giữ nguyên giường: ' + p.name); commit(); } break;
    case 'report': openReportMenu(); break;
    case 'list': openReport(); break;
    case 'shift': openShift(); break;
    case 'flow': openFlow(); break;
    case 'longStay': openLong(); break;
    case 'longPrint': printLong(); break;
    case 'longCsv': longCsv(); break;
    case 'flowNav': flowNav(+d.n); break;
    case 'flowPrint': printFlow(); break;
    case 'flowCsv': flowCsv(); break;
    case 'mb': openMb(); break;
    case 'mbNav': mbNav(+d.n); break;
    case 'mbPrint': printMb(); break;
    case 'mbCsv': mbCsv(); break;
    case 'flowFrom': changeFlowFrom(); break;
    case 'shiftDay': shiftDay(+d.n); break;
    case 'shiftPrint': printShift(); break;
    case 'repAddEv': repAddEv(d.c); break;
    case 'repDelEv': repDelEv(d.id); break;
    case 'print': printReport(); break;
    case 'csv': exportExcel(); break;
    case 'history': openHistory(); break;
    case 'undo': undoDischarge(+d.pid); break;
    case 'settings': openSettings(); break;
    case 'backup': backup(); break;
    case 'restore': $('fileRestore').value = ''; $('fileRestore').click(); break;
    case 'sample': loadSample(); break;
    case 'wipe': wipe(); break;
    case 'wipeSample': wipeSample(); break;
    case 'snap': restoreSnapshot(+d.i); break;
    case 'resetRooms': resetRooms(); break;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target, v, p;
  if (el.id === 'r_doctor') {
    reportDoctor = el.value; $('reportBox').innerHTML = reportHTML();
  } else if (el.id === 'f_doctor') {
    $('f_doctorOther').hidden = el.value !== OTHER_DOC;
    if (el.value === OTHER_DOC) $('f_doctorOther').focus();
  } else if (el.id === 'f_other') {
    if (form && el.value && can('move')) { v = el.value.split('|'); form.pick = {room: v[0], bed: +v[1]}; form.manual = true; refreshSug(); }
  } else if (el.id === 'lg_doctor') {
    longDoc = el.value; renderLong();
  } else if (el.classList && el.classList.contains('sk-chk')) {
    if (can('sk15')) toggleSk(+el.dataset.pid, +el.dataset.k, el.checked); else el.checked = !el.checked;
  } else if (el.id === 'p_hold') {
    p = patientById(+el.dataset.pid);
    if (p && can('hold')) { p.hold = el.checked; commit(); }
  } else if (el.id === 'fileRestore') {
    if (el.files && el.files[0] && can('restore')) restoreFile(el.files[0]);
  } else if (el.classList && el.classList.contains('acc-role')) {
    if (can('accounts')) accSet(el.dataset.uid, {role: el.value}, 'Đã đổi vai trò.');
  } else if (el.getAttribute && el.getAttribute('data-set')) {
    if (can('settings')) applySetting(el);
  }
});
$('q').addEventListener('input', function () { query = fold(this.value.trim()); qOpen = true; renderMap(); renderSearch(); });
$('q').addEventListener('focus', function () { if (query) { qOpen = true; renderSearch(); } });
// ô ghi của báo cáo giao ca: ghi từng ô, tự lưu sau khi ngừng gõ
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.classList && el.classList.contains('rpf') && shift.day && can('repEdit')) repQueue({k: el.getAttribute('data-k'), v: el.value});
  else if (el.id === 'f_dx') icdInput();
});
window.addEventListener('beforeunload', function () { if (shift.ops.length) repFlush(); });
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.id === 'f_dx' && icdKey(e)) return;
  if (e.key !== 'Escape') return;
  if ($('hoa')) hoaHide();
  else if (qOpen) { qOpen = false; renderSearch(); }
  else if (!$('overlay').hidden) closeModal();
});
window.addEventListener('storage', function (e) {
  if (cloud || e.key !== KEY || !e.newValue || form) return;
  try { state = migrate(JSON.parse(e.newValue)); render(); } catch (x) {}
});
$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  signIn($('l_email').value.trim(), $('l_pass').value);
});
$('pwForm').addEventListener('submit', function (e) { e.preventDefault(); submitPwChange(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); checkUpdate(); } });
// báo phiên bản mới: kiểm lần đầu sau 5 giây, sau đó 10 phút một lần và mỗi khi mở lại tab
setTimeout(function () { checkUpdate(true); }, 5000);
setInterval(checkUpdate, 60000);
// đổi đuôi liên kết (#chung, #mau) là đổi kiểu chạy, nên tải lại trang
window.addEventListener('hashchange', function () { location.reload(); });
hoaStart();

cloud = cloudConfig();
if (cloud) {
  // bản dùng chung: chưa đăng nhập thì chưa có dữ liệu nào trên màn hình
  state = defaultState(); render();
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (x) { session = null; }
  if (session && session.refresh) startCloud().catch(function () {});
  else { session = null; showLogin(); }
} else {
  state = load();
  if (DEMO && ((!state.patients.length && !state.discharged.length) || (state.sample && state.sampleVer !== SAMPLE_VER))) { state.rooms = defaultRooms(); loadSample(true); }
  else render();
}
})();
