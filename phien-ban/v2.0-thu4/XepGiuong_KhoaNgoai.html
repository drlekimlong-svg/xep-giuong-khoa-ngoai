<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- iPad / iPhone: "Thêm vào Màn hình chính" trong Safari sẽ mở toàn màn hình như một ứng dụng -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xếp giường">
<meta name="theme-color" content="#0e6655">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Xếp giường – Khoa Ngoại BV An Bình</title>
<style>
:root{
  --bg:#eef1f5;--card:#fff;--ink:#18212d;--muted:#5d6b7c;--line:#cfd6df;
  --th:#1a56c4;--th-bg:#dbe7ff;
  --nieu:#b25a00;--nieu-bg:#ffe6bf;
  --tk:#6a3cc0;--tk-bg:#e9dfff;
  --ln:#0a7468;--ln-bg:#cdf1ea;
  --m:#1f5f9e;--f:#b8336f;
  --warn:#b42318;--warn-bg:#fde8e6;--ok:#17763a;--accent:#0e6655;--accent-bg:#e6f5f1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.4 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---- thanh trên ---- */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.top h1{font-size:19px}
.top .sub{color:var(--muted);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;align-items:center}
.tools>*{margin:4px 0 4px 8px}
#q{width:230px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#9aa6b5}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.big{padding:9px 18px;font-size:15px}
.btn.danger{color:var(--warn);border-color:#e6b3ae}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

.stats{display:flex;flex-wrap:wrap;align-items:stretch;padding:10px 16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0 8px 8px 0;border-left-width:5px;min-width:120px}
.stat>span:first-child{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:19px}
.stat i{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.stat.z-TH{border-left-color:var(--th)} .stat.z-NIEU{border-left-color:var(--nieu)}
.stat.free{border-left-color:var(--ok)} .stat.bad{border-left-color:var(--warn)} .stat.none{border-left-color:var(--line)}
.stat.now{flex:1;min-width:260px;border-left-color:var(--line)}
.stat.now .chip{margin:4px 4px 0 0;font-size:13px;color:var(--ink)}

main{padding:4px 16px 24px}
.notice{background:#fff8e1;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.notice.err{background:var(--warn-bg);border-color:#e6b3ae}

/* ---- sơ đồ ---- */
.mapwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.mapin{min-width:1100px}
.maprow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.corridor{text-align:center;letter-spacing:.6em;color:#8a96a6;font-size:11px;padding:8px 0;margin:6px 0;background:repeating-linear-gradient(90deg,#f1f3f6 0 14px,#e9ecf1 14px 28px);border-radius:6px}
.cell{border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a96a6;min-height:70px;text-align:center;font-size:12px}
.cell.blank{border:0}
.cell.closed{background:repeating-linear-gradient(45deg,#f4f5f7 0 8px,#eceef2 8px 16px)}
.cell b{font-size:14px}
.room{border:1px solid var(--line);border-top:5px solid var(--line);border-radius:8px;background:#fbfcfd;padding:5px;display:flex;flex-direction:column}
.room.z-TH{border-top-color:var(--th)} .room.z-NIEU{border-top-color:var(--nieu)}
.room.off{opacity:.5}
.rhead .r1{display:flex;align-items:baseline;justify-content:space-between}
.rhead .r1 b{font-size:17px}
.rhead .cnt{font-size:12px;color:var(--muted)}
.rhead .r2{display:flex;flex-wrap:wrap;margin:2px 0 2px}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin:0 3px 2px 0;border:1px solid transparent;white-space:nowrap}
.z-TH .tag.zone{background:var(--th-bg);color:var(--th)} .z-NIEU .tag.zone{background:var(--nieu-bg);color:var(--nieu)}
.tag.g-M{background:var(--m);color:#fff} .tag.g-F{background:var(--f);color:#fff}
.tag.g-M.soft{background:#fff;color:var(--m);border-color:var(--m)} .tag.g-F.soft{background:#fff;color:var(--f);border-color:var(--f)}
.tag.g-any{background:#eef0f3;color:var(--muted)} .tag.g-X{background:var(--warn);color:#fff}
.tag.svc{background:#fff;color:#7a5b00;border-color:#d9b84a;vertical-align:2px}
.bed{display:flex;align-items:center;width:100%;height:29px;border:1px solid var(--line);border-left-width:4px;border-radius:5px;background:#fff;padding:0 4px;margin-top:3px;text-align:left;font-size:12.5px;overflow:hidden}
.bed .bn{width:14px;flex:none;color:var(--muted);font-size:11px}
.bed .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bed .gx{flex:none;font-size:12px;margin-left:2px}
.gx.g-M{color:var(--m)} .gx.g-F{color:var(--f)}
.bed .bd{flex:none;font-size:9.5px;font-weight:700;background:var(--warn);color:#fff;border-radius:3px;padding:0 3px;margin-left:3px}
.bed.free{border-style:dashed;border-left-width:1px;background:#fff}
.bed.free .nm{font-weight:400;color:#a3adba}
.bed.free:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.bed.free:hover:not(:disabled) .nm{color:var(--accent)}
.bed.occ:hover{filter:brightness(.95)}
.s-TH{background:var(--th-bg);border-color:var(--th)} .s-NIEU{background:var(--nieu-bg);border-color:var(--nieu)}
.s-TK{background:var(--tk-bg);border-color:var(--tk)} .s-LNMM{background:var(--ln-bg);border-color:var(--ln)}
.bed.board{box-shadow:0 0 0 2px var(--warn) inset}
.bed.free.held{border-color:#8a96a6;background:#f3f5f8}
.bed.free.held .nm{color:#5d6b7c;font-style:italic;font-weight:600}
.bed .bd.op{background:#5d6b7c}
.bed.dim{opacity:.22} .bed.hit{box-shadow:0 0 0 2px #111 inset}

/* ---- bảng dưới ---- */
.panels{display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{font-size:15px;margin-bottom:8px}
.panel h3 .n{display:inline-block;min-width:22px;text-align:center;background:#e7eaef;border-radius:11px;padding:0 6px;font-size:13px;margin-left:4px}
.panel h3 .n.hot{background:var(--warn);color:#fff}
.hint{color:var(--muted);font-size:13px}
.hint.warn{color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f4;padding:8px 0}
.list li:first-child{border-top:0}
.list .acts{flex:none;margin-left:10px;white-space:nowrap}
.list .acts .btn{margin-left:4px}
.mv{font-size:13px;color:#334}
.chip{display:inline-block;border:1px solid;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.lg{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:13px}
.lg>*{margin:0 6px 4px 0}
.steps{margin:6px 0 0;padding-left:18px;font-size:13px;color:#334}
footer{margin-top:12px;color:var(--muted);font-size:12.5px}

/* ---- hộp thoại ---- */
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(15,23,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1040px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:18px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:0 6px}
.mbody{padding:14px 18px}
.mbody h3{font-size:14.5px;margin:16px 0 6px}
.mbody h3:first-child{margin-top:0}
.mfoot{display:flex;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.mfoot .btn{margin-left:8px}
.mfoot .sp{flex:1}
.fld{margin-bottom:10px}
.fld>label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.fld input[type=text],.fld input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:8px 15px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.sugwrap{background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.sugwrap h3{margin:0 0 8px}
.sug{display:flex;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;background:#fff;padding:7px 10px;margin-bottom:6px}
.sug.t1{border-left-color:#c99a00} .sug.t2,.sug.t3{border-left-color:var(--warn)}
.sug.on{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.sug .sr{width:104px;flex:none;font-size:16px;font-weight:700}
.sug .sd{flex:1;font-size:13px}
.sug .sd small{color:var(--muted)}
.sug .best{flex:none;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:10px;padding:1px 8px}
.other{margin-top:4px;font-size:13px}
.other select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:320px}
.picked{margin-top:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:14px}
.picked .w{color:var(--warn);font-weight:600} .picked .i{color:var(--nieu);font-size:13px}
.err{color:var(--warn);font-weight:600;margin-top:8px;min-height:1em}
.psum{font-size:15px;margin-bottom:10px}
table.info{border-collapse:collapse;width:100%}
table.info th{text-align:left;width:160px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;vertical-align:top}
table.info td{padding:6px 0}
.chk{display:block;margin-top:12px;font-size:13.5px}
table.set{border-collapse:collapse;width:100%;font-size:13.5px}
table.set th,table.set td{border-bottom:1px solid #edf0f4;padding:5px 8px;text-align:left}
table.set th{color:var(--muted);font-size:12.5px}
table.set select,table.set input[type=number]{padding:4px 6px;border:1px solid var(--line);border-radius:6px}
table.set input[type=number]{width:60px}
.mbody textarea,.mbody input.full{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.databtns .btn{margin:0 6px 6px 0}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:260px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px solid #f0f2f5}
.log span{color:var(--muted);margin-right:8px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rbar>span{margin-right:8px;font-weight:600}
.rbar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-weight:600;margin:3px 0}
.reportbox{border:1px solid var(--line);border-radius:8px;padding:14px;max-height:60vh;overflow:auto}

/* ---- danh sách in ---- */
.rp{font-size:13px;color:#000}
.rp-top{display:flex;justify-content:space-between;font-size:12px}
.rp h2{text-align:center;font-size:17px;margin:10px 0 2px}
.rp-sum{text-align:center;margin-bottom:8px}
.rp h3{font-size:14px;margin:12px 0 4px}
.rp h3 span{font-weight:400}
.rp table{border-collapse:collapse;width:100%}
.rp th,.rp td{border:1px solid #555;padding:3px 5px;text-align:left;vertical-align:top}
.rp th{background:#eee;font-size:12px}
.rp td.c,.rp th.c{text-align:center}
.rp tr{page-break-inside:avoid}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18212d;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw}
/* ---- bản dùng chung: đăng nhập, người dùng, chỉ xem ---- */
.login{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80;overflow:auto}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 26px 20px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.logincard h2{font-size:22px;margin-bottom:4px}
.logincard .fld input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.userbox{display:inline-flex;flex-wrap:wrap;align-items:center}
.userbox>*{margin:2px 0 2px 6px}
.userbox .who{font-weight:600;white-space:nowrap}
.userbox .who small{font-weight:400;color:var(--muted)}
.sub.bad{color:var(--warn);font-weight:700}
.bed.free:disabled{cursor:default}
table.set input[type=text]{padding:4px 6px;border:1px solid var(--line);border-radius:6px;width:100%;min-width:90px}
.res-ok{color:var(--ok);font-weight:600} .res-bad{color:var(--warn);font-weight:600}
.slip{border:1px dashed #777;padding:10px 12px;margin:0 0 8px;page-break-inside:avoid;font-size:13px}
.slip b{font-size:15px}

/* ---- iPad, iPhone và màn hình hẹp ---- */
@media (max-width:900px){
  .top{padding:8px 12px}
  .top h1{font-size:17px}
  .tools{width:100%;justify-content:flex-start}
  .tools>*{margin:4px 6px 4px 0}
  #q{flex:1 1 100%;width:auto}
  .stats{padding:8px 12px 0}
  .stat{flex:1 1 28%;min-width:0;margin:0 6px 6px 0;padding:5px 8px}
  .stat b{font-size:17px}
  .stat.now{flex-basis:100%}
  main{padding:4px 12px 20px}
  .mapwrap{padding:8px}
  .mapin{min-width:0}
  /* bỏ hành lang, xếp các phòng thành lưới thẻ để không phải kéo ngang */
  .maprow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .maprow .cell,.corridor{display:none}
  .maprow+.corridor+.maprow{margin-top:6px}
  .overlay{padding:8px 4px}
  .mhead,.mbody,.mfoot{padding-left:12px;padding-right:12px}
  .mfoot{flex-wrap:wrap}
  .mfoot .btn{margin:4px 0 4px 8px}
  .grid2{grid-template-columns:1fr}
  .mbody{overflow-x:auto}
  .sug .sr{width:86px;font-size:15px}
}
/* màn hình cảm ứng: nút và ô giường to hơn, chữ trong ô nhập 16px để iPhone không tự phóng to */
@media (pointer:coarse){
  .bed{height:36px;font-size:14px}
  .btn{padding:10px 14px}
  .btn.small{padding:7px 11px}
  .seg button{padding:10px 14px}
  input,select,textarea{font-size:16px}
}
#printArea{display:none}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 id="wardName">Khoa Ngoại – Bệnh viện An Bình</h1>
    <div class="sub" id="todayLine"></div>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Tìm người bệnh / bác sĩ…" autocomplete="off">
    <button class="btn primary big" data-act="new">+ Nhận bệnh</button>
    <button class="btn" data-act="report">Danh sách ngày</button>
    <button class="btn" data-act="history">Lịch sử</button>
    <button class="btn" data-act="settings">Cài đặt</button>
    <span id="userBox" class="userbox"></span>
  </div>
</header>

<noscript><div class="notice err" style="margin:12px 16px 0">
  <b>Trang đang ở chế độ xem trước nên chưa chạy được.</b>
  Trên máy tính: bấm đúp vào file để mở bằng Chrome hoặc Edge.
  Trên iPad/iPhone: ứng dụng Tệp, Zalo, Mail chỉ xem trước chứ không chạy được trang này; cần mở bằng Safari qua một địa chỉ web.
</div></noscript>

<div class="stats" id="stats"></div>

<main>
  <div id="notice"></div>
  <section class="mapwrap"><div id="map"></div></section>
  <section class="panels">
    <div class="panel" id="pnlTransfer"></div>
    <div class="panel" id="pnlWaiting"></div>
    <div class="panel" id="pnlLegend"></div>
  </section>
  <footer id="foot"></footer>
</main>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<!-- Màn hình đăng nhập: chỉ hiện ở bản dùng chung nhiều máy -->
<div id="login" class="login" hidden>
  <form class="logincard" id="loginForm">
    <h2>Đăng nhập</h2>
    <p class="hint" style="margin-bottom:14px">Sơ đồ xếp giường – Khoa Ngoại, Bệnh viện An Bình</p>
    <div class="fld"><label for="l_email">Tên đăng nhập</label><input id="l_email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ví dụ: LNKhoi" required></div>
    <div class="fld"><label for="l_pass">Mật khẩu</label><input id="l_pass" type="password" autocomplete="current-password" required></div>
    <p id="l_err" class="err"></p>
    <button class="btn primary big" type="submit" id="l_btn" style="width:100%">Đăng nhập</button>
    <p class="hint" style="margin-top:12px">Tài khoản do quản trị viên của khoa cấp. Quên mật khẩu xin báo quản trị viên để đặt lại.</p>
    <p id="l_local" style="margin-top:10px"></p>
  </form>
</div>
<!-- Đổi mật khẩu: bắt buộc ở lần đăng nhập đầu, hoặc tự đổi bất cứ lúc nào -->
<div id="pwbox" class="login" hidden>
  <form class="logincard" id="pwForm">
    <h2 id="p_title">Đổi mật khẩu</h2>
    <p class="hint" id="p_hint" style="margin-bottom:14px"></p>
    <div class="fld"><label for="p_new">Mật khẩu mới</label><input id="p_new" type="password" autocomplete="new-password" required></div>
    <div class="fld"><label for="p_new2">Nhập lại mật khẩu mới</label><input id="p_new2" type="password" autocomplete="new-password" required></div>
    <p class="hint">Ít nhất 8 ký tự, có cả chữ và số. Không dùng lại mật khẩu ban đầu.</p>
    <p id="p_err" class="err"></p>
    <button class="btn primary big" type="submit" id="p_btn" style="width:100%">Lưu mật khẩu mới</button>
    <p style="margin-top:10px"><button type="button" class="btn small" id="p_cancel" data-act="pwCancel">Để sau</button></p>
  </form>
</div>
<div id="toast" class="toast" hidden></div>
<div id="printArea"></div>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script>
(function () {
'use strict';

/* ================= CẤU HÌNH CỐ ĐỊNH ================= */

function migrate(s) {
  var d = defaultState(), old = (s.version || 1) < 2;
  Object.keys(d).forEach(function (k) { if (s[k] === undefined || s[k] === null && d[k] !== null) s[k] = d[k]; });
  s.rooms.forEach(function (r) {
    if (r.svc === undefined) r.svc = r.size <= 3;
    // bản 1 để 616, 617 cho Tiêu hóa; Niệu cần cả phòng 6 giường Nam và Nữ

  return s;
}

}

function snapshots() {

}
function putSnapshot(label, raw, auto) {
  if (cloud) return;   // bản dùng chung: bản lưu hằng ngày nằm ở máy chủ (bảng ward_state_daily)
  var a = snapshots(), n;
  try { n = JSON.parse(raw).patients.length; } catch (e) { return; }
  if (!n && auto) return;
  a.unshift({t: nowStamp(), day: today(), auto: auto ? 1 : 0, label: label, n: n, data: raw});
  while (a.length > 10) a.pop();
  for (;;) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(a)); return; }
    catch (e) { if (a.length <= 1) return; a.pop(); }   // hết chỗ: bỏ bản cũ nhất rồi thử lại
  }
}
// Mỗi ngày giữ một bản "đầu ngày" = dữ liệu ngay trước thao tác đầu tiên của ngày đó.

// Cả sơ đồ được lưu thành một dòng trong bảng ward_state, kèm số "version" tăng dần.
// Mỗi lần lưu chỉ thành công nếu version trên máy chủ còn đúng bằng bản mình đang có;
// nếu máy khác đã lưu trước thì thao tác bị từ chối, sơ đồ được tải lại và người dùng làm lại.
// Nhờ vậy hai máy không thể xếp hai người vào cùng một giường hay ghi đè lên nhau.
function cloudConfig() {
  // fixed = bật bởi liên kết "#chung": không ngắt được trên máy, muốn dùng bản một máy thì mở liên kết thường
  function clean(c, fixed) { return {url: String(c.url).trim().replace(/\/+$/, ''), key: String(c.key).trim(), fixed: fixed}; }
  var hasDefault = !!(CLOUD_DEFAULT.url && CLOUD_DEFAULT.key), c = null;
  if (hasDefault && location.hash === '#chung') return clean(CLOUD_DEFAULT, true);
  try { c = JSON.parse(localStorage.getItem(CLOUD_KEY)); } catch (e) {}
  if (c && c.useDefault && hasDefault) return clean(CLOUD_DEFAULT, false);   // máy này đã được chuyển sang dùng chung
  if (c && c.url && c.key) return clean(c, false);                            // máy này tự nhập một dự án khác
  return null;
}
// Bản một máy không có tài khoản: người dùng có mọi quyền như quản trị viên.
function myRole() { return !cloud ? 'admin' : session && ROLE_NAMES[session.role] ? session.role : 'none'; }
function can(act) {
  var r = myRole();
  return r === 'admin' || (ROLE_ACTS[r] || []).indexOf(act) >= 0;
}
// Ẩn nút không được dùng; ô giường trống thì giữ trên sơ đồ nhưng không cho bấm.
// Các nút cố định ở đầu trang được hiện lại khi người có quyền đăng nhập; đánh dấu data-ph/data-pd để
// chỉ hiện lại đúng những gì bước này đã ẩn, không đụng tới thứ bị ẩn vì lý do khác.
function applyPerms(root) {
  Array.prototype.forEach.call((root || document).querySelectorAll('[data-act]'), function (el) {
    var a = el.getAttribute('data-act');
    if (GUARDED.indexOf(a) < 0) return;
    if (can(a)) {
      if (el.hasAttribute('data-ph')) { el.hidden = false; el.removeAttribute('data-ph'); }
      if (el.hasAttribute('data-pd')) { el.disabled = false; el.removeAttribute('data-pd'); }
    } else if (a === 'admit') {
      if (!el.disabled) { el.disabled = true; el.setAttribute('data-pd', ''); }
    } else if (!el.hidden) {
      el.hidden = true; el.setAttribute('data-ph', '');
    }
  });
}
function loginEmail(v) {
  v = String(v || '').trim().toLowerCase();
  return v.indexOf('@') >= 0 ? v : v + '@' + LOGIN_DOMAIN;
}
function fn(action, payload) { return api('POST', ACCOUNT_FN, Object.assign({action: action}, payload || {})); }
function http(method, path, body, token, extra) {
  var headers = {apikey: cloud.key, 'Content-Type': 'application/json'};
  if (token) headers.Authorization = 'Bearer ' + token;
  if (extra) Object.keys(extra).forEach(function (k) { headers[k] = extra[k]; });
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : null;
  return fetch(cloud.url + path, {method: method, headers: headers, body: body == null ? undefined : JSON.stringify(body), signal: ctl ? ctl.signal : undefined})
    .then(function (r) {
      return r.text().then(function (t) {
        clearTimeout(timer);
        var j = null;
        try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) {
          var err = new Error((j && (j.msg || j.message || j.error_description || j.error)) || 'HTTP ' + r.status);
          err.status = r.status; throw err;
        }
        return j;
      });
    }, function () { clearTimeout(timer); var err = new Error('Không kết nối được máy chủ'); err.network = true; throw err; });
}
function saveSession() {
  try { if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session)); else localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function takeTokens(j) {
  session = session || {};
  session.access = j.access_token; session.refresh = j.refresh_token;
  session.exp = j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600);
  if (j.user) { session.uid = j.user.id; session.email = j.user.email; }
  saveSession();
}
// Trả về mã truy cập còn hạn; tự gia hạn khi sắp hết.
function freshToken() {
  if (!session || !session.refresh) { var e0 = new Error('Chưa đăng nhập'); e0.auth = true; return Promise.reject(e0); }
  if (session.exp - 60 > Date.now() / 1000) return Promise.resolve(session.access);
  if (!refreshing) {
    refreshing = http('POST', '/auth/v1/token?grant_type=refresh_token', {refresh_token: session.refresh}).then(
      function (j) { refreshing = null; takeTokens(j); return session.access; },
      function (e) { refreshing = null; if (!e.network) e.auth = true; throw e; });
  }
  return refreshing;
}
function api(method, path, body, extra, retried) {
  return freshToken().then(function (tok) { return http(method, path, body, tok, extra); }).catch(function (e) {
    if (e.status === 401 && !retried && session) { session.exp = 0; return api(method, path, body, extra, true); }
    if (e.status === 401) e.auth = true;
    throw e;
  });
}
function wardPath(select, more) { return '/rest/v1/ward_state?id=eq.' + encodeURIComponent(WARD_ID) + '&select=' + select + (more || ''); }

// Nhận cả mã đăng nhập (LNKhoi) lẫn email (của quản trị viên).
function signIn(id, pass) {
  $('l_err').textContent = ''; $('l_btn').disabled = true;
  http('POST', '/auth/v1/token?grant_type=password', {email: loginEmail(id), password: pass}).then(function (j) {
    session = null; takeTokens(j);
    return startCloud();
  }).catch(function (e) {
    if (e.handled) return;
    $('l_btn').disabled = false;
    $('l_err').textContent = e.network ? 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'
      : e.status === 400 || e.status === 401 ? 'Tên đăng nhập hoặc mật khẩu không đúng.' : 'Không đăng nhập được: ' + e.message;
  });
}
// Sau khi có phiên đăng nhập: kiểm tra quyền vào khoa, tải sơ đồ, bắt đầu theo dõi thay đổi.
function startCloud() {
  return api('GET', '/rest/v1/staff?select=full_name,role,login_id,must_change,active&user_id=eq.' + encodeURIComponent(session.uid)).then(function (rows) {
    if (!rows || !rows.length) return stop('Tài khoản này chưa được cấp quyền vào khoa. Xin báo quản trị viên.');
    if (rows[0].active === false) return stop('Tài khoản này đã bị khóa. Xin báo quản trị viên.');
    var me = rows[0];
    session.name = me.full_name; session.role = me.role; session.loginId = me.login_id || '';
    session.mustChange = !!me.must_change; saveSession();
    return api('GET', wardPath('data,version')).then(function (ws) {
      if (ws && ws.length) return ws[0];
      if (!can('new')) return stop('Khoa chưa có dữ liệu. Cần quản trị viên hoặc điều dưỡng đăng nhập trước.');
      // lần đầu tiên: tạo sơ đồ trống trên máy chủ
      return api('POST', '/rest/v1/ward_state?select=data,version', {id: WARD_ID, data: defaultState(), updated_by: session.name}, {Prefer: 'return=representation'})
        .then(function (r) { return r[0]; });
    }).then(function (row) {
      state = migrate(row.data); remoteVersion = row.version; pushing = false; dirty = false;
      $('login').hidden = true; $('l_pass').value = '';
      render(); setSync('ok');
      clearInterval(pollTimer); pollTimer = setInterval(poll, 6000);
      if (session.mustChange) showPwChange(true);   // lần đăng nhập đầu: bắt buộc đổi mật khẩu ban đầu
    });
  }).catch(function (e) {
    if (e.handled) throw e;
    if (e.auth) { signOut('Phiên đăng nhập đã hết hạn, xin đăng nhập lại.'); e.handled = true; throw e; }
    showLogin(e.network ? 'Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang.' : 'Không tải được dữ liệu: ' + e.message);
    e.handled = true; throw e;
  });
  function stop(msg) { signOut(msg); var e = new Error(msg); e.handled = true; throw e; }
}
function signOut(msg) {
  var tok = session && session.access, email = session && session.email;
  if (tok) http('POST', '/auth/v1/logout', null, tok).catch(function () {});
  var shown = session && (session.loginId || session.email);
  session = null; saveSession();
  clearInterval(pollTimer); clearTimeout(retryTimer); pushing = false; dirty = false; remoteVersion = 0; syncState = '';
  state = defaultState(); closeModal(); $('pwbox').hidden = true; render();
  if (shown || email) $('l_email').value = shown || email;

}
// Gửi sơ đồ lên máy chủ. Nếu đang gửi dở thì đánh dấu để gửi tiếp ngay sau đó.
function push() {
  if (!cloud || !session) return;
  if (pushing) { dirty = true; return; }
  clearTimeout(retryTimer);
  pushing = true; dirty = false; setSync('saving');
  api('PATCH', wardPath('version', '&version=eq.' + remoteVersion), {data: state, updated_by: session.name}, {Prefer: 'return=representation'}).then(function (rows) {
    pushing = false;

/* ---- đổi mật khẩu ---- */

function parseRole(tok, full) {

  if (/^(dd|dieu duong|nurse)$/.test(t)) return 'nurse';

  if (/^(qt|quan tri|admin)$/.test(t)) return 'qt';

  if (/(^|\s)(dd|cn\.? ?dd|dieu duong)\b|đd/i.test(head)) return 'nurse';

    if (id) taken[id.toLowerCase()] = 1;

function fmtDate(s) { if (!s) return ''; var a = String(s).split('-'); return a.length === 3 ? a[2] + '/' + a[1] + '/' + a[0] : s; }
// Nhận "12/10/2026" (ngày/tháng/năm); để trống = hôm nay; sai định dạng hoặc ngày tương lai = null.
function parseDate(s) {
  s = String(s || '').trim();
  if (!s) return today();
  var m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);
  if (!m) return null;
  var d = new Date(+m[3], +m[2] - 1, +m[1]);
  if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
  return ymd(d) > today() ? null : ymd(d);
}
function dayN(s) {
  var a = String(s || '').split('-'); if (a.length !== 3) return 1;
  var d0 = new Date(+a[0], +a[1] - 1, +a[2]), t = new Date();
  var d1 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.max(1, Math.round((d1 - d0) / 86400000) + 1);
}
function fold(s) {
  s = String(s || '').toLowerCase();
  if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s.replace(/đ/g, 'd');
}
function shortName(n) {

  if (a.length < 2) return a[0] || '';
  var ini = '';
  for (var i = 0; i < a.length - 1; i++) ini += a[i].charAt(0).toUpperCase() + '.';
  return ini + ' ' + a[a.length - 1];
}
function roomById(id) { for (var i = 0; i < state.rooms.length; i++) if (state.rooms[i].id === id) return state.rooms[i]; return null; }
function patientById(id) { id = +id; for (var i = 0; i < state.patients.length; i++) if (state.patients[i].id === id) return state.patients[i]; return null; }
function specById(id) { for (var i = 0; i < state.specs.length; i++) if (state.specs[i].id === id) return state.specs[i]; return null; }

  var t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3800);
}

/* ================= LOGIC XẾP GIƯỜNG ================= */
function occupantsOf(roomId, extra) {
  var a = state.patients.filter(function (p) { return p.room === roomId; });
  if (extra) extra.forEach(function (e) { if (e.room === roomId) a.push(e); });
  return a;
}
function freeBedsOf(rm, occ) {
  var used = {}, f = [];
  occ.forEach(function (p) { used[p.bed] = 1; });
  for (var b = 1; b <= rm.size; b++) if (!used[b]) f.push(b);
  return f;
}
function gendersOf(occ) {
  var m = false, f = false;
  occ.forEach(function (p) { if (p.gender === 'M') m = true; else f = true; });
  return m && f ? 'X' : m ? 'M' : f ? 'F' : null;
}
// Phòng cố định Nam/Nữ chỉ nhận đúng giới; phòng "linh hoạt" theo giới của người đang nằm.
function genderFits(rm, g, occ) {
  if (rm.gender !== 'auto') return rm.gender === g;
  var now = gendersOf(occ);
  return now === null || now === g;
}
function roomGenderText(rm, occ) {
  if (rm.gender !== 'auto') return GENDER[rm.gender];
  var g = gendersOf(occ);
  return g === 'X' ? 'cả Nam và Nữ' : GENDER[g];
}
function colOf(id) { var i = MAP.top.indexOf(id); return i >= 0 ? i : MAP.bot.indexOf(id); }
function zoneDist(rm, z) {
  var best = 99, c = colOf(rm.id);
  state.rooms.forEach(function (r) {
    if (r.active && r.zone === z) { var d = Math.abs(colOf(r.id) - c); if (d < best) best = d; }
  });
  return best;
}
// Mức phù hợp: 0 = đúng khu, đúng loại phòng · 1 = đúng khu, khác loại phòng
//              2 = nằm nhờ khu khác, đúng loại phòng · 3 = nằm nhờ, khác loại phòng
// Đúng loại phòng: có yêu cầu thì đúng số giường; không yêu cầu thì phải là phòng thường (không phải dịch vụ).
function typeOK(rm, p) { return p.want ? rm.size === p.want : !rm.svc; }
function tierOf(rm, p) {
  var inZone = rm.zone === homeZone(p.spec), ok = typeOK(rm, p);
  return inZone ? (ok ? 0 : 1) : (ok ? 2 : 3);
}
function isSvcSize(n) { return state.rooms.some(function (r) { return r.active && r.svc && r.size === n; }); }
// Danh sách phòng có thể xếp, tốt nhất đứng đầu.
function candidates(p, opt) {
  opt = opt || {};
  var z = homeZone(p.spec), list = [], held = heldMap();
  state.rooms.forEach(function (rm, idx) {
    if (!rm.active) return;
    if (opt.excludeRoom && rm.id === opt.excludeRoom) return;
    var occ = occupantsOf(rm.id, opt.extra);
    var free = freeBedsOf(rm, occ);
    if (!free.length || !genderFits(rm, p.gender, occ)) return;
    var tier = tierOf(rm, p);
    var opens = rm.gender === 'auto' && occ.length === 0 ? 1 : 0;
    var own = 0, open = [];   // own: giường cũ của chính người này (mổ về); open: giường trống không giữ cho ai
    free.forEach(function (b) { var h = held[rm.id + '|' + b]; if (!h) open.push(b); else if (h.id === p.id) own = b; });
    list.push({
      room: rm, bed: own || open[0] || free[0], free: free.length, tier: tier, opens: opens, own: !!own, heldOnly: !own && !open.length,
      key: [
        own ? 0 : open.length ? 1 : 2,                     // giường cũ khi mổ về → giường trống → giường đang giữ cho người đi mổ (sau cùng)
        p.want ? tier : [0, 2, 1, 3][tier],                // không yêu cầu: nằm nhờ phòng thường trước, phòng dịch vụ là lựa chọn sau cùng
        p.want ? Math.abs(rm.size - p.want) : -rm.size,   // không yêu cầu: ưu tiên phòng nhiều giường
        rm.zone === z ? 0 : zoneDist(rm, z),               // nằm nhờ: ưu tiên phòng sát khu của mình
        opens,                                             // hạn chế mở phòng linh hoạt mới
        -occ.length,                                       // dồn phòng đang có người trước
        idx
      ]
    });
  });
  list.sort(function (a, b) {
    for (var i = 0; i < a.key.length; i++) if (a.key[i] !== b.key[i]) return a.key[i] - b.key[i];
    return 0;
  });
  return list;
}
function candLabel(c, p) {
  var parts = [c.tier <= 1 ? 'Đúng khu ' + ZONES[c.room.zone] : 'Nằm nhờ khu ' + ZONES[c.room.zone]];
  if (p.want) parts.push(c.room.size === p.want ? 'đúng loại phòng' : 'khác loại phòng yêu cầu');
  else if (c.room.svc) parts.push('phòng dịch vụ, người bệnh không yêu cầu');
  if (c.own) parts.push('giường cũ trước khi đi mổ');
  if (c.heldOnly) parts.push('giường đang giữ cho người bệnh đi mổ');
  return parts.join(' · ');
}
// Giường đang giữ cho người bệnh đi mổ: vẫn tính là trống, nhưng chỉ gợi ý cho người khác khi hết chỗ.
function heldMap() {
  var m = {};
  state.patients.forEach(function (p) { if (p.away && p.keepRoom) m[p.keepRoom + '|' + p.keepBed] = p; });
  return m;
}
function endAway(p) { p.away = false; p.keepRoom = null; p.keepBed = null; }
// Đề xuất chuyển: người chờ giường trước, rồi người nằm nhờ / chưa đúng loại phòng, theo ngày vào.
function transferSuggestions() {
  var extra = [], out = [];
  var ps = state.patients.filter(function (p) { return !p.away && !(p.hold && p.room); });
  ps.sort(function (a, b) {
    var wa = a.room ? 1 : 0, wb = b.room ? 1 : 0;
    if (wa !== wb) return wa - wb;
    if (a.admittedAt !== b.admittedAt) return a.admittedAt < b.admittedAt ? -1 : 1;
    return a.id - b.id;
  });
  ps.forEach(function (p) {
    var cur = p.room ? roomById(p.room) : null;
    var curTier = cur ? tierOf(cur, p) : 9;
    if (curTier === 0) return;
    var curOK = cur ? typeOK(cur, p) : false;
    var cands = candidates(p, {excludeRoom: p.room, extra: extra});
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      if (c.heldOnly && cur) continue;   // người đang có giường thì không đề xuất lấy giường giữ cho người đi mổ
      // không đề xuất nếu làm mất loại phòng người bệnh đang được đáp ứng
      if (c.tier < curTier && (typeOK(c.room, p) || !curOK)) {
        out.push({p: p, from: cur, to: c});
        extra.push({room: c.room.id, bed: c.bed, gender: p.gender, id: -1});

}
function moveReason(t) {
  var p = t.p, to = t.to, parts = [];
  if (!t.from) {
    parts.push(to.tier <= 1 ? 'đúng khu ' + ZONES[to.room.zone] : 'nằm nhờ khu ' + ZONES[to.room.zone]);
    if (!typeOK(to.room, p)) parts.push(p.want ? 'chưa đúng loại phòng' : 'phòng dịch vụ');
    return parts.join(', ');
  }
  if (to.tier <= 1 && tierOf(t.from, p) >= 2) parts.push('về đúng khu ' + ZONES[to.room.zone]);
  if (typeOK(to.room, p) && !typeOK(t.from, p)) parts.push(p.want ? 'đúng phòng ' + p.want + ' giường' : 'về phòng thường');
  return parts.join(', ');
}
function placeOK(p, roomId, bed) {
  var rm = roomById(roomId);
  if (!rm) return false;
  var occ = occupantsOf(roomId).filter(function (x) { return x.id !== p.id; });
  if (bed > rm.size || occ.some(function (x) { return x.bed === bed; })) {
    alert('Giường ' + bedLabel(roomId, bed) + ' không còn trống. Vui lòng chọn giường khác.');
    return false;
  }
  if (!genderFits(rm, p.gender, occ)) {
    if (!confirm('Phòng ' + rm.id + ' đang là phòng ' + roomGenderText(rm, occ) + '.\nVẫn xếp người bệnh ' + GENDER[p.gender] + ' vào phòng này?')) return false;
  }
  var h = heldMap()[roomId + '|' + bed];
  if (h && h.id !== p.id && !confirm('Giường ' + bedLabel(roomId, bed) + ' đang giữ cho ' + h.name + ' (đi mổ).\nVẫn xếp người bệnh khác vào giường này?')) return false;
  return true;
}
function movePatient(p, roomId, bed) {
  if (!placeOK(p, roomId, bed)) return false;
  var from = p.room ? bedLabel(p.room, p.bed) : 'chờ giường';
  if (p.away) { endAway(p); addLog('Mổ về: ' + p.name + ' → ' + bedLabel(roomId, bed)); }
  else addLog('Chuyển giường: ' + p.name + ' · ' + from + ' → ' + bedLabel(roomId, bed));
  p.room = roomId; p.bed = bed; p.hold = false;
  return true;

// Mổ về: giường cũ còn trống và đúng giới thì về thẳng, không thì mở bảng chọn giường.
function backFromSurgery(pid) {
  var p = patientById(pid);
  if (!p || !p.away) return;
  var rm = p.keepRoom ? roomById(p.keepRoom) : null, bed = p.keepBed;
  if (rm && rm.active && bed <= rm.size) {
    var occ = occupantsOf(rm.id);
    if (!occ.some(function (x) { return x.bed === bed; }) && genderFits(rm, p.gender, occ)) {
      movePatient(p, rm.id, bed);
      closeModal(); commit(); toast(p.name + ' đã về lại giường cũ ' + bedLabel(rm.id, bed) + '.');
      return;
    }
  }
  openForm('move', {pid: p.id});

function bedTotals() {

  state.rooms.forEach(function (rm) {
    if (!rm.active) return;
    z[rm.zone].t += rm.size; z[rm.zone].o += occupantsOf(rm.id).length;
  });
  return z;
}
function renderStats() {

    '<div class="stat free"><span>Giường trống</span><b>' + free + '</b></div>' +
    '<div class="stat ' + (board ? 'bad' : 'none') + '"><span>Đang nằm nhờ</span><b>' + board + '</b></div>' +
    '<div class="stat ' + (wait ? 'bad' : 'none') + '"><span>Chờ giường</span><b>' + wait + '</b></div>' +

  var waiting = state.patients.filter(function (p) { return !p.room && !p.away; });
  var away = state.patients.filter(function (p) { return p.away; }), heldNow = heldMap();
  h = '<h3>Chờ xếp giường <span class="n' + (waiting.length ? ' hot' : '') + '">' + waiting.length + '</span></h3>';
  if (!waiting.length) h += '<p class="hint">Không có người bệnh chờ giường.</p>';
  else {
    h += '<ul class="list">';
    waiting.forEach(function (p) {
      var t = wmap[p.id];
      h += '<li><div>' + patientChip(p) + '<div class="mv">' +
        (t ? 'Có giường: <b>' + bedLabel(t.to.room.id, t.to.bed) + '</b> · ' + esc(moveReason(t)) : 'Chưa có giường đúng giới') + '</div></div><div class="acts">' +
        (t ? '<button class="btn small primary" data-act="doMove" data-pid="' + p.id + '" data-room="' + t.to.room.id + '" data-bed="' + t.to.bed + '">Xếp vào</button>' : '') +
        '<button class="btn small" data-act="move" data-pid="' + p.id + '">Chọn giường</button></div></li>';
    });
    h += '</ul>';
  }
  if (away.length) {
    h += '<h3 style="margin-top:14px">Đang đi mổ <span class="n">' + away.length + '</span></h3><ul class="list">';
    away.forEach(function (p) {
      var kept = p.keepRoom && heldNow[p.keepRoom + '|' + p.keepBed] === p && !occupantsOf(p.keepRoom).some(function (x) { return x.bed === p.keepBed; });
      h += '<li><div>' + patientChip(p) + '<div class="mv">Đi mổ ' + fmtDate(p.opAt).slice(0, 5) +
        (p.keepRoom ? ' · giường cũ ' + bedLabel(p.keepRoom, p.keepBed) + (kept ? ' (đang giữ)' : ' (đã có người khác)') : ' · chưa có giường') + '</div></div>' +
        '<div class="acts"><button class="btn small primary" data-act="back" data-pid="' + p.id + '">Mổ về</button>' +
        '<button class="btn small" data-act="discharge" data-pid="' + p.id + '" title="Người bệnh không quay lại khoa">Không về</button></div></li>';
    });
    h += '</ul>';
  }
  $('pnlWaiting').innerHTML = h;

  $('pnlLegend').innerHTML = '<h3>Chú thích</h3><div class="lg">' +

    '<div class="lg"><span class="tag g-M">Nam</span><span class="tag g-F">Nữ</span> phòng cố định giới</div>' +
    '<div class="lg"><span class="tag g-M soft">Nam*</span><span class="tag g-any">Linh hoạt</span> phòng theo giới người vào trước</div>' +

    '<div class="lg"><span class="bed occ s-NIEU board" style="width:96px;margin:0"><span class="nm">N.V. A</span><span class="bd">nhờ</span></span> nằm nhờ khu khác</div>' +
    '<ol class="steps"><li>Bấm <b>+ Nhận bệnh</b>, chọn giới và chuyên khoa.</li><li>Phần mềm gợi ý giường – bấm <b>Lưu</b>.</li><li>Bấm vào giường có người để chuyển giường hoặc cho ra khoa.</li></ol>';
}

/* ================= HỘP THOẠI ================= */
function showModal(html, cls) {
  $('modal').className = 'modal' + (cls ? ' ' + cls : '');
  $('modal').innerHTML = html;
  $('overlay').hidden = false;
  $('overlay').scrollTop = 0;
  applyPerms($('modal'));
}
function closeModal() { $('overlay').hidden = true; $('modal').innerHTML = ''; form = null; }
function mhead(title) { return '<div class="mhead"><h2>' + title + '</h2><button class="x" data-act="close" title="Đóng">×</button></div>'; }
function field(label, inner) { return '<div class="fld"><label>' + label + '</label>' + inner + '</div>'; }
function seg(name, options, val) {
  return '<div class="seg">' + options.map(function (o) {
    return '<button type="button" class="' + (String(o[0]) === String(val) ? 'on' : '') + '" data-act="seg" data-field="' + name + '" data-val="' + o[0] + '">' + esc(o[1]) + '</button>';
  }).join('') + '</div>';
}
function roomSizes() {
  var seen = {}, a = [];
  state.rooms.forEach(function (r) { if (r.active && !seen[r.size]) { seen[r.size] = 1; a.push(r.size); } });
  return a.sort(function (x, y) { return x - y; });
}
function doctorNames() {
  var seen = {}, a = [];
  state.doctors.forEach(function (n) { if (n && !seen[n]) { seen[n] = 1; a.push(n); } });
  state.patients.forEach(function (p) { if (p.doctor && !seen[p.doctor]) { seen[p.doctor] = 1; a.push(p.doctor); } });
  return a;
}

/* ---- nhận bệnh / sửa / chuyển giường ---- */
function openForm(mode, opt) {
  opt = opt || {};
  var p = opt.pid ? patientById(opt.pid) : null;
  form = {
    mode: mode, pid: p ? p.id : null,
    name: p ? p.name : '', yob: p && p.yob ? p.yob : '', gender: p ? p.gender : '', spec: p ? p.spec : '',
    doctor: p ? p.doctor : '', want: p ? p.want : 0, dx: p ? p.dx : '', note: p ? p.note : '',
    date: p ? p.admittedAt : today(), src: p ? p.src || '' : '',
    pick: opt.room ? {room: opt.room, bed: opt.bed} : null,
    manual: !!opt.room, preset: !!opt.room
  };
  var f = form, h = mhead(mode === 'new' ? 'Nhận bệnh mới' : mode === 'edit' ? 'Sửa thông tin người bệnh' : (p.room ? 'Chuyển giường' : p.away ? 'Mổ về – xếp giường' : 'Xếp giường')) + '<div class="mbody">';
  if (mode === 'move') {
    h += '<p class="psum">' + patientChip(p) + ' · ' + (p.room ? 'đang nằm <b>' + bedLabel(p.room, p.bed) + '</b>'
      : p.away ? '<b>mổ về</b>' + (p.keepRoom ? ' · giường cũ ' + bedLabel(p.keepRoom, p.keepBed) + ' không còn dùng được' : '') : '<b>đang chờ giường</b>') +
      (p.want ? ' · yêu cầu phòng ' + p.want + ' giường' : '') + '</p>';
  } else {
    var wants = [[0, 'Không yêu cầu (phòng thường)']].concat(roomSizes().map(function (n) { return [n, n + ' giường' + (isSvcSize(n) ? ' – dịch vụ' : '')]; }));
    h += '<div class="grid2">' +
      field('Họ và tên *', '<input id="f_name" type="text" value="' + esc(f.name) + '" autocomplete="off">') +
      field('Năm sinh', '<input id="f_yob" type="number" min="1900" max="2100" value="' + esc(f.yob) + '">') + '</div>' +
      field('Giới *', seg('gender', [['M', 'Nam'], ['F', 'Nữ']], f.gender)) +
      field('Chuyên khoa *', seg('spec', state.specs.map(function (s) { return [s.id, s.name]; }), f.spec)) +
      field('Nhận từ' + (mode === 'new' ? ' *' : ''), seg('src', SOURCES, f.src)) +
      field('Loại phòng người bệnh yêu cầu', seg('want', wants, f.want)) +
      '<div class="grid2">' +
      field('Bác sĩ phụ trách', '<input id="f_doctor" type="text" list="dl_doctor" value="' + esc(f.doctor) + '" autocomplete="off"><datalist id="dl_doctor">' +
        doctorNames().map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>') +
      field('Ngày vào khoa (ngày/tháng/năm)', '<input id="f_date" type="text" placeholder="dd/mm/yyyy" value="' + esc(fmtDate(f.date)) + '" autocomplete="off">') + '</div>' +
      field('Chẩn đoán', '<input id="f_dx" type="text" value="' + esc(f.dx) + '" autocomplete="off">') +
      field('Ghi chú', '<input id="f_note" type="text" value="' + esc(f.note) + '" autocomplete="off">');
  }
  if (mode !== 'edit') h += '<div class="sugwrap"><h3>Xếp giường</h3><div id="sugBox"></div></div>';
  h += '<p id="f_err" class="err"></p></div><div class="mfoot"><button class="btn" data-act="close">Hủy</button>' +
    '<button class="btn primary" data-act="saveForm">' + (mode === 'new' ? 'Lưu &amp; xếp giường' : mode === 'edit' ? 'Lưu' : 'Xác nhận') + '</button></div>';
  showModal(h);
  refreshSug();
  if (mode === 'new') $('f_name').focus();
}
function refreshSug() {
  var box = $('sugBox'), f = form;
  if (!box || !f) return;
  if (!f.gender || !f.spec) { box.innerHTML = '<p class="hint">Chọn <b>Giới</b> và <b>Chuyên khoa</b> để xem gợi ý giường.</p>'; return; }
  var p = {id: f.pid, gender: f.gender, spec: f.spec, want: f.want};
  var cur = f.pid ? patientById(f.pid) : null;
  var cands = candidates(p, {excludeRoom: cur && cur.room ? cur.room : null});
  if (!f.manual) f.pick = cands.length ? {room: cands[0].room.id, bed: cands[0].bed} : 'wait';
  var isPick = function (room, bed) { return f.pick && f.pick !== 'wait' && f.pick.room === room && f.pick.bed === bed; };
  var h = '';
  if (!cands.length) h += '<p class="hint warn">Không còn giường trống đúng giới ở cả hai khu. Có thể để chờ giường hoặc tự chọn giường bên dưới.</p>';
  cands.slice(0, 6).forEach(function (c, i) {
    h += '<button type="button" class="sug t' + c.tier + (isPick(c.room.id, c.bed) ? ' on' : '') + '" data-act="pick" data-room="' + c.room.id + '" data-bed="' + c.bed + '">' +
      '<span class="sr">' + bedLabel(c.room.id, c.bed) + '</span><span class="sd">' + esc(candLabel(c, p)) +
      '<br><small>Phòng ' + c.room.size + ' giường' + (c.room.svc ? ' (dịch vụ)' : '') + ' · còn ' + c.free + ' giường trống' + (c.opens ? ' · phòng đang trống hoàn toàn' : '') + '</small></span>' +
      (i === 0 ? '<span class="best">Đề xuất</span>' : '') + '</button>';
  });
  var opts = '', held = heldMap();
  state.rooms.forEach(function (rm) {
    if (!rm.active) return;
    var occ = occupantsOf(rm.id);
    freeBedsOf(rm, occ).forEach(function (b) {
      var g = rm.gender !== 'auto' ? GENDER[rm.gender] : (gendersOf(occ) ? roomGenderText(rm, occ) : 'linh hoạt');
      var hp = held[rm.id + '|' + b];
      opts += '<option value="' + rm.id + '|' + b + '"' + (f.manual && isPick(rm.id, b) ? ' selected' : '') + '>' +
        bedLabel(rm.id, b) + ' · ' + rm.size + ' giường · ' + ZONES[rm.zone] + ' · ' + g +
        (hp && hp.id !== f.pid ? ' · đang giữ cho ' + esc(shortName(hp.name)) + ' (đi mổ)' : '') + '</option>';
    });
  });
  h += '<div class="other">Hoặc tự chọn giường trống: <select id="f_other"><option value="">— chọn giường —</option>' + opts + '</select> ' +
    '<button type="button" class="btn small' + (f.pick === 'wait' ? ' on' : '') + '" data-act="pickWait">Chưa xếp giường (chờ)</button></div>';
  h += '<div class="picked">' + pickSummary(p) + '</div>';
  box.innerHTML = h;
}
function pickSummary(p) {
  var f = form;
  if (!f.pick || f.pick === 'wait') return '➜ <b>Chưa xếp giường</b> – đưa vào danh sách chờ.';
  var rm = roomById(f.pick.room), w = [];
  var occ = occupantsOf(rm.id).filter(function (x) { return x.id !== f.pid; });
  if (!genderFits(rm, p.gender, occ)) w.push('<span class="w">⚠ Phòng này đang là phòng ' + roomGenderText(rm, occ) + '.</span>');
  var hp = heldMap()[rm.id + '|' + f.pick.bed];
  if (hp && hp.id !== f.pid) w.push('<span class="w">⚠ Giường này đang giữ cho ' + esc(hp.name) + ' (đi mổ).</span>');
  if (rm.zone !== homeZone(p.spec)) w.push('<span class="i">Nằm nhờ khu ' + ZONES[rm.zone] + ' – sẽ được nhắc chuyển khi khu ' + ZONES[homeZone(p.spec)] + ' có giường.</span>');
  if (p.want && rm.size !== p.want) w.push('<span class="i">Chưa đúng loại phòng yêu cầu – sẽ được nhắc khi có phòng ' + p.want + ' giường.</span>');
  else if (!p.want && rm.svc) w.push('<span class="i">Đây là phòng dịch vụ mà người bệnh không yêu cầu – sẽ được nhắc chuyển khi có phòng thường.</span>');
  return '➜ Xếp vào <b>phòng ' + rm.id + ' – giường ' + f.pick.bed + '</b> (phòng ' + rm.size + ' giường' + (rm.svc ? ' dịch vụ' : '') + ', khu ' + ZONES[rm.zone] + ')' + (w.length ? '<br>' + w.join('<br>') : '');
}
function addDoctor(n) { if (n && state.doctors.indexOf(n) < 0) state.doctors.push(n); }
function saveForm() {
  var f = form, p, msg;
  if (f.mode !== 'edit' && !can('move')) return false;   // bác sĩ chỉ được lưu phần bổ sung thông tin
  function fail(m) { $('f_err').textContent = m; return false; }
  if (f.mode !== 'move') {
    f.name = $('f_name').value.replace(/\s+/g, ' ').trim();
    f.yob = $('f_yob').value.trim();
    f.doctor = $('f_doctor').value.replace(/\s+/g, ' ').trim();
    f.dx = $('f_dx').value.trim();
    f.note = $('f_note').value.trim();
    var dt = parseDate($('f_date').value);
    if (!dt) return fail('Ngày vào khoa chưa đúng, hãy ghi theo dạng ngày/tháng/năm, ví dụ ' + fmtDate(today()) + '.');
    f.date = dt;
    if (!f.name) return fail('Chưa nhập họ tên.');
    if (!f.gender) return fail('Chưa chọn giới.');
    if (!f.spec) return fail('Chưa chọn chuyên khoa.');
    if (f.mode === 'new' && !f.src) return fail('Chưa chọn người bệnh được nhận từ đâu.');
    if (f.yob &&!(+f.yob >= 1900 && +f.yob <= new Date().getFullYear())) return fail('Năm sinh chưa hợp lệ.');
  }
  if (f.mode === 'new') {
    p = {id: null, name: f.name, yob: f.yob ? +f.yob : null, gender: f.gender, spec: f.spec, doctor: f.doctor, want: f.want,
      dx: f.dx, note: f.note, admittedAt: f.date, src: f.src, room: null, bed: null, hold: false};
    if (f.pick && f.pick !== 'wait') {
      if (!placeOK(p, f.pick.room, f.pick.bed)) { refreshSug(); return false; }
      p.room = f.pick.room; p.bed = f.pick.bed;
    }
    p.id = state.seq++;
    state.patients.push(p);
    addDoctor(p.doctor);
    addLog('Nhận bệnh từ ' + labelOf(SOURCES, p.src) + ': ' + p.name + ' (' + specName(p.spec) + ', ' + GENDER[p.gender] + ') → ' + (p.room ? bedLabel(p.room, p.bed) : 'chờ giường'));
    msg = 'Đã nhận ' + p.name + (p.room ? ' vào ' + bedLabel(p.room, p.bed) : ' – đang chờ giường');
  } else if (!patientById(f.pid)) {
    // bản dùng chung: máy khác vừa cho người bệnh này ra khoa trong lúc bảng đang mở
    closeModal(); render(); toast('Người bệnh này vừa được máy khác cập nhật, xin xem lại sơ đồ.');
    return false;
  } else if (f.mode === 'edit') {
    p = patientById(f.pid);
    p.name = f.name; p.yob = f.yob ? +f.yob : null; p.gender = f.gender; p.spec = f.spec; p.doctor = f.doctor;
    p.want = f.want; p.dx = f.dx; p.note = f.note; p.admittedAt = f.date; p.src = f.src;
    addDoctor(p.doctor);
    addLog('Sửa thông tin: ' + p.name);
    msg = 'Đã lưu thông tin.';
  } else {
    p = patientById(f.pid);
    if (!f.pick || f.pick === 'wait') {
      if (p.room) { addLog('Trả giường: ' + p.name + ' · ' + bedLabel(p.room, p.bed) + ' → chờ giường'); p.room = null; p.bed = null; }
      if (p.away) { endAway(p); addLog('Mổ về: ' + p.name + ' → chờ giường'); }
      msg = p.name + ' đang ở danh sách chờ giường.';
    } else {
      if (!movePatient(p, f.pick.room, f.pick.bed)) { refreshSug(); return false; }
      msg = 'Đã chuyển ' + p.name + ' sang ' + bedLabel(p.room, p.bed);
    }
  }
  closeModal(); commit(); toast(msg);
  return true;
}

/* ---- hồ sơ người bệnh ---- */
function openPatient(pid) {
  var p = patientById(pid); if (!p) return;
  var rm = p.room ? roomById(p.room) : null;
  var board = rm && rm.zone !== homeZone(p.spec);
  function row(k, v) { return '<tr><th>' + k + '</th><td>' + v + '</td></tr>'; }
  var h = mhead(esc(p.name)) + '<div class="mbody"><table class="info">' +
    row('Giường', rm ? 'Phòng ' + rm.id + ' – giường ' + p.bed + ' (phòng ' + rm.size + ' giường, khu ' + ZONES[rm.zone] + ')' + (board ? ' <span class="chip warn">nằm nhờ</span>' : '')
      : p.away ? '<span class="chip warn">Đang đi mổ</span>' + (p.keepRoom ? ' giường cũ ' + bedLabel(p.keepRoom, p.keepBed) : '')
      : '<span class="chip warn">Đang chờ giường</span>') +
    row('Giới · năm sinh', GENDER[p.gender] + (p.yob ? ' · ' + p.yob + ' (' + (new Date().getFullYear() - p.yob) + ' tuổi)' : '')) +
    row('Chuyên khoa', '<span class="chip s-' + p.spec + '">' + esc(specName(p.spec)) + '</span>') +

    row('Chẩn đoán', esc(p.dx || '—')) +
    row('Ngày vào khoa', fmtDate(p.admittedAt) + ' (ngày thứ ' + dayN(p.admittedAt) + ')') +
    row('Nhận từ', esc(labelOf(SOURCES, p.src) || '—')) +
    (p.opAt ? row('Đi mổ', 'ngày ' + fmtDate(p.opAt) + (p.away ? ' – chưa về khoa' : '')) : '') +
    row('Loại phòng yêu cầu', p.want ? p.want + ' giường' + (rm && rm.size !== p.want ? ' <span class="chip warn">chưa đáp ứng</span>' : '')

  function detail(by, list) {
    var a = list.filter(function (x) { return by[x[0]]; }).map(function (x) { return x[1] + ' ' + by[x[0]]; });
    return a.length ? ' (' + a.join(', ') + ')' : '';
  }
  state.patients.concat(state.discharged).forEach(function (p) {
    if (p.admittedAt === t) { nIn++; inBy[p.src] = (inBy[p.src] || 0) + 1; }
    if (p.opAt === t) nOp++;
  });
  state.discharged.forEach(function (d) {

      '“Khôi phục từ file” cũng là cách đưa dữ liệu từ bản một máy lên dùng chung.</p>'
      : '<p class="hint">Mọi thao tác được lưu tự động ngay vào trình duyệt của máy này, không cần bấm lưu. Rủi ro còn lại là trình duyệt bị xóa dữ liệu duyệt web hoặc máy hỏng, nên phần mềm tự sao lưu thêm:</p>' +
      '<label class="chk" style="margin:6px 0 10px"><input type="checkbox" data-set="autoFile"' + (state.autoFile === false ? '' : ' checked') + '> ' +
      'Mỗi ngày tự tải một file sao lưu về thư mục Tải xuống (Downloads) của máy, vào lúc có thao tác đầu tiên trong ngày</label>') +
    '<div class="databtns"><button class="btn" data-act="backup">Sao lưu ra file ngay</button><button class="btn" data-act="restore">Khôi phục từ file</button>' +
    '<button class="btn" data-act="sample">Nạp dữ liệu mẫu</button><button class="btn" data-act="resetRooms">Về sơ đồ phân khu mặc định</button>' +
    '<button class="btn danger" data-act="wipe">Xóa toàn bộ người bệnh</button></div>';
  if (!cloud) {
    var snaps = snapshots();
    h += '<h3>6. Bản lưu tự động trong máy</h3><p class="hint">Mỗi ngày phần mềm giữ lại một bản đầu ngày, và một bản trước mỗi lần xóa hay khôi phục; tối đa 10 bản. Dùng khi lỡ thao tác nhầm.</p>';
    if (snaps.length) {
      h += '<table class="set"><tr><th>Bản lưu</th><th>Lưu lúc</th><th>Số người bệnh</th><th></th></tr>';
      snaps.forEach(function (s, i) {
        h += '<tr><td>' + esc(s.label) + '</td><td>' + esc(s.t) + '</td><td>' + s.n + '</td><td><button class="btn small" data-act="snap" data-i="' + i + '">Quay về bản này</button></td></tr>';
      });
      h += '</table>';
    } else h += '<p class="hint">Chưa có bản lưu nào.</p>';
  }
  h += '<h3>' + (cloud ? '6' : '7') + '. Dùng chung nhiều máy (Supabase, đang thử nghiệm)</h3>';
  if (cloud) {
    h += '<p class="hint">Máy này đang dùng chung dữ liệu tại <b>' + esc(cloud.url) + '</b>.' +
      (cloud.fixed ? ' Đang mở bằng liên kết dùng chung (đuôi #chung); muốn dùng bản một máy thì mở liên kết thường.' : '') + '</p>' +
      (cloud.fixed ? '' : '<div class="databtns"><button class="btn" data-act="cloudOff">Ngắt kết nối, quay về bản một máy</button></div>');
  } else if (CLOUD_DEFAULT.url && CLOUD_DEFAULT.key) {
    h += '<p class="hint">Máy này đang chạy bản một máy. Chuyển sang dùng chung thì mở app sẽ phải đăng nhập và sơ đồ là sơ đồ chung của khoa trên máy chủ. ' +
      'Dữ liệu đang có trong máy này vẫn được giữ nguyên và không tự gửi lên.</p>' +
      '<div class="databtns"><button class="btn" data-act="cloudOn">Chuyển máy này sang dùng chung</button></div>';
  } else {
    h += '<p class="hint">Nhập địa chỉ dự án Supabase và khóa công khai để máy này đăng nhập và dùng chung sơ đồ với các máy khác. ' +
      'Dữ liệu đang có trong máy này vẫn được giữ nguyên và không tự gửi lên.</p>' +
      '<div class="grid2" style="grid-template-columns:1fr 1fr"><div class="fld"><label>Địa chỉ dự án (https://….supabase.co)</label><input id="c_url" type="text" autocomplete="off"></div>' +
      '<div class="fld"><label>Khóa công khai (publishable / anon)</label><input id="c_key" type="text" autocomplete="off"></div></div>' +
      '<div class="databtns"><button class="btn" data-act="cloudOn">Kết nối</button></div>';
  }
  h += '</div><div class="mfoot"><button class="btn primary" data-act="close">Xong</button></div>';
  showModal(h, 'wide');
}
function applySetting(el) {
  var set = el.getAttribute('data-set'), rm = el.dataset.room ? roomById(el.dataset.room) : null;
  if (set === 'zone') rm.zone = el.value;
  else if (set === 'gender') rm.gender = el.value;
  else if (set === 'active') rm.active = el.checked;
  else if (set === 'svc') rm.svc = el.checked;
  else if (set === 'autoFile') state.autoFile = el.checked;
  else if (set === 'size') {
    var n = Math.round(+el.value), maxBed = 0;
    occupantsOf(rm.id).forEach(function (p) { if (p.bed > maxBed) maxBed = p.bed; });
    if (!(n >= 1 && n <= 12) || n < maxBed) {
      alert(n < maxBed ? 'Phòng ' + rm.id + ' đang có người nằm giường số ' + maxBed + ', không giảm xuống ' + n + ' giường được.' : 'Số giường phải từ 1 đến 12.');
      el.value = rm.size; return;
    }
    rm.size = n;
  }
  else if (set === 'specZone') specById(el.dataset.spec).zone = el.value;
  else if (set === 'doctors') {
    var seen = {};
    state.doctors = el.value.split(/\n/).map(function (s) { return s.replace(/\s+/g, ' ').trim(); }).filter(function (s) { if (!s || seen[s]) return false; seen[s] = 1; return true; });
  }
  else if (set === 'ward') state.ward = el.value.trim() || DEFAULT_WARD;
  commit();
  if ($('set_sum')) $('set_sum').innerHTML = nieuCheckText();
}
function backup() { backupFile(); renderFoot(); toast('Đã tải file sao lưu về máy.'); }
function restoreSnapshot(i) {
  var s = snapshots()[i], data;
  if (!s) return;
  try { data = JSON.parse(s.data); } catch (e) { alert('Bản lưu này bị lỗi, không đọc được.'); return; }
  if (!confirm('Đưa dữ liệu về bản lưu "' + s.label + '" (' + s.n + ' người bệnh, lưu lúc ' + s.t + ')?\nDữ liệu hiện tại sẽ được giữ thành một bản lưu để có thể quay lại.')) return;
  keepCopy('Trước khi quay về bản lưu');
  state = migrate(data); closeModal(); commit(); toast('Đã quay về bản lưu: ' + s.label);
}
function restoreFile(file) {
  var r = new FileReader();
  r.onload = function () {
    var s;
    try { s = JSON.parse(r.result); } catch (e) { s = null; }
    if (!s || !Array.isArray(s.rooms) || !Array.isArray(s.patients)) { alert('File sao lưu không hợp lệ.'); return; }
    if (!confirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại bằng dữ liệu trong file (' + s.patients.length + ' người bệnh). Tiếp tục?')) return;
    keepCopy('Trước khi khôi phục từ file');
    state = migrate(s); closeModal(); commit(); toast('Đã khôi phục dữ liệu từ file.');
  };
  r.readAsText(file);
}
function wipe() {
  if (!confirm('XÓA toàn bộ người bệnh, lịch sử và nhật ký? (Phân khu phòng và danh sách bác sĩ được giữ lại)')) return;
  if (!confirm('Chắc chắn xóa? (Vẫn có thể lấy lại trong Cài đặt → Bản lưu tự động trong máy)')) return;
  keepCopy('Trước khi xóa toàn bộ');
  clearPatients();
  closeModal(); commit(); toast('Đã xóa toàn bộ người bệnh.');
}
function clearPatients() {
  state.patients = []; state.discharged = []; state.log = [];
  if (state.sample) state.doctors = state.doctors.filter(function (n) { return SAMPLE_DOCTORS.indexOf(n) < 0; });
  state.sample = false;
}
function wipeSample() {
  if (!confirm('Xóa toàn bộ dữ liệu mẫu trên sơ đồ để bắt đầu dùng thật?')) return;
  clearPatients(); commit(); toast('Đã xóa dữ liệu mẫu. Có thể bắt đầu nhận bệnh.');
}
function resetRooms() {
  var def = defaultRooms(), bad = null;
  state.patients.forEach(function (p) {
    if (!p.room) return;
    var d = def.filter(function (r) { return r.id === p.room; })[0];
    if (!d || p.bed > d.size) bad = p;
  });
  if (bad) { alert('Không đặt lại được vì ' + bad.name + ' đang nằm giường ' + bedLabel(bad.room, bad.bed) + ' không có trong sơ đồ mặc định.'); return; }
  if (!confirm('Đặt lại khu, giới và số giường của tất cả các phòng về mặc định?')) return;
  state.rooms = def; commit(); openSettings();
}
function loadSample() {
  if ((state.patients.length || state.discharged.length) && !confirm('Dữ liệu mẫu sẽ THAY THẾ toàn bộ người bệnh hiện có. Tiếp tục?')) return;
  function ago(n) { var d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }
  keepCopy('Trước khi nạp dữ liệu mẫu');
  state.patients = []; state.discharged = []; state.log = [];
  state.sample = true;
  SAMPLE_DOCTORS.forEach(addDoctor);
  // [họ tên, năm sinh, giới, chuyên khoa, bác sĩ, loại phòng yêu cầu, chẩn đoán, số ngày đã nằm, phòng ép, giường ép]
  var S = [
    ['Lý Văn Tám', 1958, 'M', 'NIEU', 'Bác sĩ D', 0, 'Sỏi niệu quản trái', 1, '618', 1],
    ['Nguyễn Văn An', 1971, 'M', 'TH', 'Bác sĩ A', 0, 'Viêm ruột thừa cấp', 2],
    ['Trần Thị Bích', 1985, 'F', 'TH', 'Bác sĩ A', 0, 'Sỏi túi mật', 1],
    ['Lê Văn Cường', 1960, 'M', 'TH', 'Bác sĩ B', 0, 'Thoát vị bẹn phải', 3],
    ['Phạm Thị Dung', 1949, 'F', 'TH', 'Bác sĩ B', 0, 'Tắc ruột do dính', 4],
    ['Huỳnh Văn Em', 1992, 'M', 'TH', 'Bác sĩ A', 0, 'Viêm ruột thừa cấp', 0],
    ['Võ Thị Phượng', 1978, 'F', 'TH', 'Bác sĩ C', 2, 'U đại tràng sigma', 6],
    ['Đặng Văn Giàu', 1955, 'M', 'TH', 'Bác sĩ C', 0, 'Thủng dạ dày', 5],
    ['Bùi Thị Hoa', 1990, 'F', 'TH', 'Bác sĩ A', 0, 'Viêm túi mật cấp', 1],
    ['Đỗ Văn Hùng', 1983, 'M', 'TH', 'Bác sĩ B', 3, 'Trĩ độ III', 1],
    ['Ngô Thị Kim', 1967, 'F', 'TH', 'Bác sĩ C', 0, 'Sỏi ống mật chủ', 2],
    ['Dương Văn Lâm', 1975, 'M', 'TH', 'Bác sĩ B', 0, 'Áp xe cạnh hậu môn', 0],
    ['Hồ Thị Mai', 1999, 'F', 'TH', 'Bác sĩ A', 0, 'Viêm ruột thừa cấp', 0],
    ['Trương Văn Nam', 1950, 'M', 'NIEU', 'Bác sĩ D', 0, 'Tăng sinh lành tính tuyến tiền liệt', 3],
    ['Phan Thị Oanh', 1982, 'F', 'NIEU', 'Bác sĩ E', 0, 'Sỏi thận phải', 2],
    ['Mai Văn Phúc', 1969, 'M', 'NIEU', 'Bác sĩ E', 3, 'Sỏi bàng quang', 1],
    ['Đinh Thị Quyên', 1974, 'F', 'NIEU', 'Bác sĩ D', 2, 'Sỏi niệu quản phải', 0],
    ['Cao Văn Rạng', 1963, 'M', 'NIEU', 'Bác sĩ E', 0, 'U bàng quang', 4],
    ['Tạ Thị Sương', 1991, 'F', 'NIEU', 'Bác sĩ D', 0, 'Viêm thận bể thận', 1],
    ['Vũ Văn Tài', 1988, 'M', 'TK', 'Bác sĩ B', 0, 'Chấn thương sọ não nhẹ', 1],
    ['Lâm Thị Uyên', 1957, 'F', 'LNMM', 'Bác sĩ C', 0, 'Suy giãn tĩnh mạch chi dưới', 2]
  ];
  S.forEach(function (a, i) {
    var p = {id: state.seq++, name: a[0], yob: a[1], gender: a[2], spec: a[3], doctor: a[4], want: a[5], dx: a[6], note: 'dữ liệu mẫu',
      admittedAt: ago(a[7]), src: /cấp|Thủng|Tắc|Chấn thương|Áp xe/.test(a[6]) ? 'CC' : i % 5 === 0 ? 'KK' : 'PK', room: null, bed: null, hold: false};
    if (a[8]) { p.room = a[8]; p.bed = a[9]; }
    else { var c = candidates(p)[0]; if (c) { p.room = c.room.id; p.bed = c.bed; } }
    state.patients.push(p);
  });
  // một người đang đi mổ để thấy cách giữ giường
  state.patients.forEach(function (p) {
    if (p.name !== 'Lê Văn Cường' || !p.room) return;
    p.away = true; p.opAt = today(); p.keepRoom = p.room; p.keepBed = p.bed; p.room = null; p.bed = null;
  });
  addLog('Nạp dữ liệu mẫu (' + S.length + ' người bệnh)');
  closeModal(); commit(); toast('Đã nạp dữ liệu mẫu để tập thao tác.');
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var d = el.dataset, p;
  if (GUARDED.indexOf(d.act) >= 0 && !can(d.act)) { toast('Tài khoản ' + (ROLE_NAMES[myRole()] || '') + ' không được làm việc này.'); return; }
  switch (d.act) {
    case 'logout': if (confirm('Đăng xuất khỏi máy này?')) signOut(); break;
    case 'pwChange': showPwChange(false); break;
    case 'pwCancel': $('pwbox').hidden = true; break;
    case 'accounts': openAccounts(); break;
    case 'accPreview': accPreview(); break;
    case 'accCreate': accCreate(); break;
    case 'accPrint': accPrint(); break;
    case 'accReset': accReset(d.uid); break;
    case 'accLock': if (confirm(d.on === '1' ? 'Mở khóa tài khoản này?' : 'Khóa tài khoản này? Người đó sẽ không vào được app nữa.')) accSet(d.uid, {active: d.on === '1'}, d.on === '1' ? 'Đã mở khóa.' : 'Đã khóa tài khoản.'); break;
    case 'cloudOn': cloudOn(); break;
    case 'cloudOff': cloudOff(); break;
    case 'new': openForm('new'); break;
    case 'admit': openForm('new', {room: d.room, bed: +d.bed}); break;
    case 'patient': openPatient(+d.pid); break;
    case 'close': closeModal(); break;
    case 'seg':
      Array.prototype.forEach.call(el.parentNode.children, function (b) { b.classList.remove('on'); });
      el.classList.add('on');
      if (d.field === 'reportBy') { reportBy = d.val; $('reportBox').innerHTML = reportHTML(); }
      else if (d.field === 'outType') { if (outForm) { outForm.type = d.val; $('out_hint').textContent = outHint(patientById(outForm.pid), d.val); } }
      else if (d.field === 'src') { if (form) form.src = d.val; }
      else if (form) { form[d.field] = d.field === 'want' ? +d.val : d.val; if (!form.preset) form.manual = false; refreshSug(); }
      break;
    case 'confirmOut': confirmOut(); break;
    case 'back': backFromSurgery(+d.pid); break;
    case 'pick': if (form) { form.pick = {room: d.room, bed: +d.bed}; form.manual = true; refreshSug(); } break;
    case 'pickWait': if (form) { form.pick = 'wait'; form.manual = true; refreshSug(); } break;
    case 'saveForm': saveForm(); break;
    case 'edit': openForm('edit', {pid: +d.pid}); break;
    case 'move': openForm('move', {pid: +d.pid}); break;
    case 'discharge': openDischarge(+d.pid); break;
    case 'doMove':
      p = patientById(+d.pid);
      if (p && confirm((p.room ? 'Chuyển ' : 'Xếp ') + p.name + (p.room ? ' từ ' + bedLabel(p.room, p.bed) : '') + ' sang ' + bedLabel(d.room, +d.bed) + '?') && movePatient(p, d.room, +d.bed)) {
        commit(); toast('Đã chuyển ' + p.name + ' sang ' + bedLabel(p.room, p.bed));
      }
      break;
    case 'hold': p = patientById(+d.pid); if (p) { p.hold = true; addLog('Giữ nguyên giường: ' + p.name); commit(); } break;
    case 'report': openReport(); break;
    case 'print': printReport(); break;
    case 'csv': exportExcel(); break;
    case 'history': openHistory(); break;
    case 'undo': undoDischarge(+d.pid); break;
    case 'settings': openSettings(); break;
    case 'backup': backup(); break;
    case 'restore': $('fileRestore').value = ''; $('fileRestore').click(); break;
    case 'sample': loadSample(); break;
    case 'wipe': wipe(); break;
    case 'wipeSample': wipeSample(); break;
    case 'snap': restoreSnapshot(+d.i); break;
    case 'resetRooms': resetRooms(); break;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target, v, p;
  if (el.id === 'r_doctor') {
    reportDoctor = el.value; $('reportBox').innerHTML = reportHTML();
  } else if (el.id === 'f_other') {
    if (form && el.value && can('move')) { v = el.value.split('|'); form.pick = {room: v[0], bed: +v[1]}; form.manual = true; refreshSug(); }
  } else if (el.id === 'p_hold') {
    p = patientById(+el.dataset.pid);
    if (p && can('hold')) { p.hold = el.checked; commit(); }
  } else if (el.id === 'fileRestore') {
    if (el.files && el.files[0] && can('restore')) restoreFile(el.files[0]);
  } else if (el.classList && el.classList.contains('acc-role')) {
    if (can('accounts')) accSet(el.dataset.uid, {role: el.value}, 'Đã đổi vai trò.');
  } else if (el.getAttribute && el.getAttribute('data-set')) {
    if (can('settings')) applySetting(el);
  }
});
$('q').addEventListener('input', function () { query = fold(this.value.trim()); renderMap(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeModal(); });
window.addEventListener('storage', function (e) {
  if (cloud || e.key !== KEY || !e.newValue || form) return;
  try { state = migrate(JSON.parse(e.newValue)); render(); } catch (x) {}
});
$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  signIn($('l_email').value.trim(), $('l_pass').value);
});
$('pwForm').addEventListener('submit', function (e) { e.preventDefault(); submitPwChange(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
// đổi đuôi liên kết (#chung, #mau) là đổi kiểu chạy, nên tải lại trang
window.addEventListener('hashchange', function () { location.reload(); });

cloud = cloudConfig();
if (cloud) {
  // bản dùng chung: chưa đăng nhập thì chưa có dữ liệu nào trên màn hình
  state = defaultState(); render();
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (x) { session = null; }
  if (session && session.refresh) startCloud().catch(function () {});
  else { session = null; showLogin(); }
} else {
  state = load();
  if (DEMO && !state.patients.length && !state.discharged.length) loadSample();
  else render();
}
})();
</script>
